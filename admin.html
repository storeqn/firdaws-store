<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#eef3fb"><link rel="manifest" href="admin-manifest.json?v=10"><link rel="apple-touch-icon" href="icons/icon-192.png?v=10"><title>إدارة معرض الفردوس</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fb;color:#0f172a;font-family:Tahoma,Arial,sans-serif}.container{width:min(920px,calc(100% - 24px));margin:18px auto 60px}.head{text-align:center;padding:14px 0 8px}.head img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:22px;padding:8px;box-shadow:0 10px 28px #94a3b826}.head h1{margin:14px 0 6px;font-size:28px}.head p{margin:0;color:#7b8ba4}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 12px}.tab{border:1px solid #d5dfec;background:#fff;color:#1687ef;border-radius:18px;padding:15px 8px;font-weight:800;font-size:15px}.tab.active{background:#0b1426;color:#fff}.card{background:#fff;border-radius:28px;padding:18px;box-shadow:0 14px 40px #64748b18}.hidden{display:none!important}.toolbar{display:flex;gap:10px}.toolbar input{flex:1;border:1px solid #d6e1ef;border-radius:17px;padding:15px;font:inherit;font-size:16px}.refresh{width:58px;border:0;border-radius:17px;background:#111;color:#fff;font-size:24px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.filters select{width:100%;border:1px solid #d6e1ef;border-radius:15px;background:#fff;padding:12px;font:inherit;color:#1e293b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}.stat{border:1px solid #e2e8f0;background:#f8fafc;border-radius:14px;padding:10px 5px;text-align:center;font-size:13px;font-weight:800}.stat.all{color:#087ee8;border-color:#8dc8ff}.stat.ok{color:#079b55}.stat.out{color:#e22}.products{display:grid;gap:10px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid #e5eaf1;border-radius:20px;padding:11px;background:#fff;box-shadow:0 8px 22px #64748b0c}.item img{width:72px;height:72px;object-fit:contain;background:#f8fafc;border-radius:15px}.item h3{margin:0 0 6px;font-size:15px}.meta{font-size:12px;color:#718096;line-height:1.75}.price{color:#087ee8;font-weight:800}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-top:5px}.badge.ok{background:#e4f8ec;color:#079b55}.badge.out{background:#fff0f0;color:#e22}.edit{border:0;border-radius:12px;background:#eef6ff;color:#087ee8;padding:10px 12px;font-weight:800}.empty{text-align:center;padding:28px;color:#64748b}.load-error{background:#fff4f4;color:#b42318;padding:16px;border-radius:16px;text-align:center}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,textarea{width:100%;border:1px solid #dbe4ee;border-radius:13px;padding:12px 13px;font:inherit;font-size:16px;background:#fff}textarea{min-height:96px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.check{display:flex;align-items:center;gap:7px;background:#f7fafd;border:1px solid #e6edf7;border-radius:12px;padding:11px}.check input{width:18px;height:18px}.save,.cancel{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}.save{background:#111;color:#fff}.cancel{background:#e2e8f0;margin-top:8px}.status{margin-top:12px;text-align:center;padding:11px;border-radius:12px;display:none}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.wait{display:block;background:#fff8e8;color:#6b521f}.status.err{display:block;background:#ffebeb;color:#b42318}.preview{display:none;width:120px;height:120px;object-fit:contain;background:#f7f7f7;border-radius:12px;margin-top:8px}.help{font-size:12px;color:#64748b;line-height:1.8;margin-top:6px}.brandsFrame{width:100%;height:1100px;border:0;border-radius:22px}.combo{position:relative}.comboBtn{position:absolute;left:3px;top:3px;bottom:3px;width:44px;border:0;border-radius:10px;background:#eef2f7}.comboMenu{position:absolute;z-index:100;top:calc(100% + 5px);right:0;left:0;max-height:240px;overflow:auto;background:#fff;border:1px solid #dbe4ee;border-radius:13px;box-shadow:0 12px 30px #0002;padding:5px}.comboOption{width:100%;border:0;background:#fff;text-align:right;padding:11px;border-radius:9px}@media(max-width:600px){.container{width:calc(100% - 18px);margin-top:8px}.head h1{font-size:25px}.tab{font-size:13px;padding:13px 5px}.item{grid-template-columns:64px minmax(0,1fr)}.item img{width:64px;height:64px}.edit{grid-column:1/-1;width:100%}.row,.checks{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="head"><img src="icons/firdaws-logo.svg"><h1>إدارة معرض الفردوس</h1><p>إدارة المنتجات والخيارات وشعارات البراندات</p></div><div class="tabs"><button id="tabList" class="tab active">المنتجات الحالية</button><button id="tabForm" class="tab">+ إضافة منتج</button><button id="tabBrands" class="tab">🏷️ البراندات</button></div><section id="listView" class="card"><div class="toolbar"><input id="search" type="search" placeholder="ابحث باسم المنتج أو القسم أو البراند..."><button id="refresh" class="refresh">↻</button></div><div class="filters"><select id="categoryFilter"><option value="">جميع الأقسام</option></select><select id="brandFilter"><option value="">جميع البراندات</option></select></div><div class="stats"><div id="statAll" class="stat all">الكل (0)</div><div id="statOk" class="stat ok">متوفر (0)</div><div id="statOut" class="stat out">نفدت الكمية (0)</div></div><div id="products" class="products"><div class="empty">جاري تحميل المنتجات...</div></div></section><section id="formView" class="card hidden"><form id="form"><input id="id" type="hidden"><div class="field"><label>اسم المنتج *</label><input id="name" required></div><div class="row"><div class="field"><label>السعر *</label><input id="price" type="number" min="0" required></div><div class="field"><label>السعر القديم</label><input id="old_price" type="number" min="0"></div></div><div class="field"><label>الكمية</label><input id="stock" type="number" min="0" value="1"><div class="help">عند كتابة 0 سيظهر «نفدت الكمية».</div></div><div class="row"><div class="field"><label>القسم الرئيسي *</label><div class="combo"><input id="category" required autocomplete="off"><button type="button" id="categoryBtn" class="comboBtn">⌄</button><div id="categoryMenu" class="comboMenu hidden"></div></div></div><div class="field"><label>القسم الفرعي</label><input id="sub_category"></div></div><div class="field"><label>البراند</label><div class="combo"><input id="brand" autocomplete="off"><button type="button" id="brandBtn" class="comboBtn">⌄</button><div id="brandMenu" class="comboMenu hidden"></div></div></div><div class="checks"><label class="check"><input id="offer" type="checkbox">عرض خاص</label><label class="check"><input id="featured" type="checkbox">منتج مميز</label><label class="check"><input id="active" type="checkbox" checked>متوفر</label></div><div class="field"><label>ملاحظة الخصم</label><input id="discount_note"></div><div class="field"><label>رابط الصورة الرئيسية *</label><input id="image" type="url" required><img id="preview" class="preview"></div><div class="field"><label>صور إضافية</label><textarea id="images"></textarea></div><div class="field"><label>خيارات يحددها الزبون</label><textarea id="options" placeholder="اللون: أسود | أبيض&#10;الذاكرة: 128GB | 256GB"></textarea></div><div class="field"><label>الوصف</label><textarea id="desc"></textarea></div><button id="save" class="save">+ إضافة المنتج</button><button id="cancel" class="cancel hidden" type="button">إلغاء التعديل</button><div id="status" class="status"></div></form></section><section id="brandsView" class="hidden"><iframe class="brandsFrame" src="brands-admin.html?v=5"></iframe></section></div><script>const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxKjSwjbAoe-uWiPOuAwgaeXQQYP0csZ6kOF7PwPszm0zFeG1hpyvoW2eAOpq1vHGKeQQ/exec';const CACHE='firdaws_admin_products_v3',$=id=>document.getElementById(id);let data=[],editing='',savedBrands=[];const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const truthy=v=>/^(1|true|yes|نعم|active)$/i.test(String(v||'').trim());const uniq=a=>[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));function parseCSV(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);v='';if(r.some(x=>x!==''))a.push(r);r=[]}else v+=c}r.push(v);if(r.some(x=>x!==''))a.push(r);if(!a.length)return[];const h=a.shift().map(x=>x.trim().toLowerCase().replace(/^\ufeff/,''));return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,String(x[i]??'').trim()]))) }function show(v){['list','form','brands'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));$('tabList').classList.toggle('active',v==='list');$('tabForm').classList.toggle('active',v==='form');$('tabBrands').classList.toggle('active',v==='brands')}function fillFilters(){const c=$('categoryFilter').value,b=$('brandFilter').value;$('categoryFilter').innerHTML='<option value="">جميع الأقسام</option>'+uniq(data.map(x=>x.category)).map(x=>`<option>${esc(x)}</option>`).join('');$('brandFilter').innerHTML='<option value="">جميع البراندات</option>'+uniq(data.map(x=>x.brand)).map(x=>`<option>${esc(x)}</option>`).join('');$('categoryFilter').value=c;$('brandFilter').value=b}function render(){const q=$('search').value.trim().toLowerCase(),cf=$('categoryFilter').value,bf=$('brandFilter').value;const all=data.length,ok=data.filter(p=>p.stock===''||Number(p.stock||0)>0).length,out=data.filter(p=>p.stock!==''&&Number(p.stock||0)<=0).length;$('statAll').textContent=`الكل (${all})`;$('statOk').textContent=`متوفر (${ok})`;$('statOut').textContent=`نفدت الكمية (${out})`;const a=data.filter(x=>(!q||[x.name,x.category,x.sub_category,x.brand].join(' ').toLowerCase().includes(q))&&(!cf||x.category===cf)&&(!bf||x.brand===bf));$('products').innerHTML=a.length?a.map(p=>{const sold=p.stock!==''&&Number(p.stock||0)<=0;return `<div class="item"><img src="${esc(p.image)}" loading="lazy"><div><h3>${esc(p.name)}</h3><div class="meta">${esc([p.category,p.sub_category,p.brand].filter(Boolean).join(' • '))}<br><span class="price">${Number(String(p.price||0).replace(/[,،]/g,'' )).toLocaleString('ar-IQ')} د.ع</span><br><span class="badge ${sold?'out':'ok'}">${sold?'نفدت الكمية':'متوفر'}</span></div></div><button class="edit" data-id="${esc(p.id)}">✎ تعديل</button></div>`}).join(''):'<div class="empty">لا توجد نتائج مطابقة للبحث أو الفلاتر.</div>'}function fetchWithTimeout(url,ms=7000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t))}async function loadBrands(){try{const r=await fetchWithTimeout(SCRIPT_URL+'?action=brands&_='+Date.now(),5000);const j=await r.json();savedBrands=Array.isArray(j.brands)?j.brands:[]}catch{savedBrands=[]}}async function load(){let hadCache=false;try{const cached=JSON.parse(localStorage.getItem(CACHE)||'[]');if(Array.isArray(cached)&&cached.length){data=cached;hadCache=true;fillFilters();render()}}catch{}if(!hadCache)$('products').innerHTML='<div class="empty">جاري تحميل المنتجات...</div>';try{const r=await fetchWithTimeout(CSV_URL+'&_='+Date.now(),10000);if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();const fresh=parseCSV(text).filter(x=>x.id||x.name);if(!fresh.length)throw new Error('لم تصل بيانات المنتجات');data=fresh;localStorage.setItem(CACHE,JSON.stringify(fresh));fillFilters();render();loadBrands()}catch(e){if(!data.length)$('products').innerHTML='<div class="load-error">تعذر تحميل المنتجات. اضغط زر ↻ للمحاولة مرة أخرى.<br><small>'+esc(e.name==='AbortError'?'انتهت مهلة الاتصال':(e.message||'خطأ اتصال'))+'</small></div>'}}function reset(){editing='';$('form').reset();$('active').checked=true;$('stock').value=1;$('id').value='';$('save').textContent='+ إضافة المنتج';$('cancel').classList.add('hidden');$('preview').style.display='none';$('status').className='status'}function edit(p){editing=p.id;['id','name','price','old_price','stock','category','sub_category','brand','discount_note','image','desc'].forEach(k=>$(k).value=p[k]||'');$('offer').checked=truthy(p.offer);$('featured').checked=truthy(p.featured);$('active').checked=!p.active||truthy(p.active);$('images').value=(p.images||'').split('|').join('\n');$('options').value=(p.options||'').split(';').join('\n');$('save').textContent='حفظ التعديلات';$('cancel').classList.remove('hidden');if(p.image){$('preview').src=p.image;$('preview').style.display='block'}show('form');scrollTo(0,0)}function menu(id,vals){const m=$(id+'Menu');m.innerHTML=uniq(vals).map(x=>`<button type="button" class="comboOption" data-v="${esc(x)}">${esc(x)}</button>`).join('');m.classList.remove('hidden');m.onclick=e=>{const b=e.target.closest('[data-v]');if(b){$(id).value=b.dataset.v;m.classList.add('hidden')}}} $('categoryBtn').onclick=()=>menu('category',data.map(x=>x.category));$('brandBtn').onclick=()=>menu('brand',[...data.map(x=>x.brand),...savedBrands.map(x=>x.name)]);$('image').oninput=e=>{if(e.target.value){$('preview').src=e.target.value;$('preview').style.display='block'}else $('preview').style.display='none'};$('tabList').onclick=()=>show('list');$('tabForm').onclick=()=>{reset();show('form')};$('tabBrands').onclick=()=>show('brands');$('cancel').onclick=()=>{reset();show('list')};$('refresh').onclick=()=>{if(!data.length)$('products').innerHTML='<div class="empty">جاري تحديث المنتجات...</div>';load()};$('search').oninput=render;$('categoryFilter').onchange=render;$('brandFilter').onchange=render;$('products').onclick=e=>{const b=e.target.closest('[data-id]');if(b){const p=data.find(x=>x.id===b.dataset.id);if(p)edit(p)}};$('form').onsubmit=async e=>{e.preventDefault();const s={action:editing?'update':'add',id:editing||'',name:$('name').value.trim(),price:$('price').value,old_price:$('old_price').value,stock:String(Math.max(0,Number($('stock').value)||0)),category:$('category').value.trim(),sub_category:$('sub_category').value.trim(),brand:$('brand').value.trim(),offer:$('offer').checked?'نعم':'',featured:$('featured').checked?'نعم':'',active:$('active').checked?'نعم':'لا',discount_note:$('discount_note').value.trim(),image:$('image').value.trim(),images:$('images').value.trim().split(/\n+/).filter(Boolean).join('|'),options:$('options').value.trim().split(/\n+/).filter(Boolean).join(';'),desc:$('desc').value.trim()};$('save').disabled=true;$('status').textContent='جاري الحفظ...';$('status').className='status wait';try{await fetch(SCRIPT_URL,{method:'POST',body:new URLSearchParams(s),mode:'no-cors',keepalive:true});$('status').textContent='✓ تم إرسال الحفظ';$('status').className='status ok';setTimeout(async()=>{reset();show('list');await load();$('save').disabled=false},1000)}catch{$('status').textContent='تعذر الحفظ. تحقق من الإنترنت.';$('status').className='status err';$('save').disabled=false}};load();</script></body></html>
