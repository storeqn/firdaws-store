<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#eef3fb"><link rel="manifest" href="admin-manifest.json?v=8"><link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png?v=8"><title>إدارة معرض الفردوس</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fb;color:#0f172a;font-family:Tahoma,Arial,sans-serif}.container{width:min(920px,calc(100% - 24px));margin:18px auto 50px}.head{text-align:center;margin-bottom:15px}.head img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:16px;padding:5px}.head h1{margin:8px 0 3px;font-size:24px}.head p{margin:0;color:#64748b;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;z-index:20;background:#eef3fb;padding:6px 0}.tab{border:1px solid #dbe4ee;background:#fff;border-radius:14px;padding:13px 7px;font-weight:800}.tab.active{background:#0b1220;color:#fff}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}.hidden{display:none!important}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.refresh{width:48px;border:0;border-radius:12px;background:#111;color:#fff;font-size:19px}.products{display:grid;gap:10px}.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #dbe4ee;border-radius:16px;padding:10px}.item img{width:64px;height:64px;object-fit:contain;background:#f7f7f7;border-radius:12px}.item h3{margin:0 0 4px;font-size:14px}.meta{font-size:12px;color:#64748b;line-height:1.7}.edit{border:0;border-radius:11px;background:#111;color:#fff;padding:9px 12px;font-weight:700}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,textarea{width:100%;border:1px solid #dbe4ee;border-radius:13px;padding:12px 13px;font:inherit;font-size:16px;background:#fff}textarea{min-height:96px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.check{display:flex;align-items:center;gap:7px;background:#f7fafd;border:1px solid #e6edf7;border-radius:12px;padding:11px}.check input{width:18px;height:18px}.save,.cancel{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}.save{background:#111;color:#fff}.cancel{background:#e2e8f0;margin-top:8px}.status{margin-top:12px;text-align:center;padding:11px;border-radius:12px;display:none}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.wait{display:block;background:#fff8e8;color:#6b521f}.status.err{display:block;background:#ffebeb;color:#b42318}.count{font-size:12px;color:#777;margin-bottom:10px}.preview{display:none;width:120px;height:120px;object-fit:contain;background:#f7f7f7;border-radius:12px;margin-top:8px}.help{font-size:12px;color:#64748b;line-height:1.8;margin-top:6px}.optionBox{background:#f8fafc;border:1px solid #dbe4ee;border-radius:16px;padding:13px}.combo{position:relative}.combo input{padding-left:52px}.comboBtn{position:absolute;left:3px;top:3px;bottom:3px;width:44px;border:0;border-radius:10px;background:#eef2f7;font-size:20px}.comboMenu{position:absolute;z-index:100;top:calc(100% + 5px);right:0;left:0;max-height:250px;overflow:auto;background:#fff;border:1px solid #dbe4ee;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:5px}.comboOption{width:100%;border:0;background:#fff;text-align:right;padding:12px;border-radius:9px;font:inherit}.comboEmpty{padding:12px;color:#888;text-align:center;font-size:13px}.brandsFrame{width:100%;height:1100px;border:0;border-radius:22px;background:#eef3fb}@media(max-width:600px){.row,.checks{grid-template-columns:1fr}.item{grid-template-columns:58px minmax(0,1fr)}.item img{width:58px;height:58px}.edit{grid-column:1/-1;width:100%}.tab{font-size:12px;padding:11px 4px}}</style></head><body><div class="container"><div class="head"><img src="icons/firdaws-logo.svg" alt=""><h1>إدارة معرض الفردوس</h1><p>إدارة المنتجات والخيارات وشعارات البراندات</p></div><div class="tabs"><button id="tabList" class="tab active">المنتجات الحالية</button><button id="tabForm" class="tab">+ إضافة منتج</button><button id="tabBrands" class="tab">🏷️ البراندات</button></div><section id="listView" class="card"><div class="toolbar"><input id="search" type="search" placeholder="ابحث باسم المنتج أو القسم أو البراند"><button id="refresh" class="refresh">↻</button></div><div id="count" class="count"></div><div id="products" class="products">جاري التحميل...</div></section><section id="formView" class="card hidden"><form id="form"><input id="id" type="hidden"><div class="field"><label>اسم المنتج *</label><input id="name" required></div><div class="row"><div class="field"><label>السعر *</label><input id="price" type="number" min="0" required></div><div class="field"><label>السعر القديم</label><input id="old_price" type="number" min="0"></div></div><div class="field"><label>الكمية</label><input id="stock" type="number" min="0" value="1"><div class="help">عند كتابة 0 سيظهر «نفدت الكمية».</div></div><div class="row"><div class="field"><label>القسم الرئيسي *</label><div class="combo"><input id="category" required autocomplete="off" placeholder="اختر أو اكتب قسمًا"><button type="button" id="categoryBtn" class="comboBtn">⌄</button><div id="categoryMenu" class="comboMenu hidden"></div></div></div><div class="field"><label>القسم الفرعي</label><div class="combo"><input id="sub_category" autocomplete="off" placeholder="اختياري"><button type="button" id="sub_categoryBtn" class="comboBtn">⌄</button><div id="sub_categoryMenu" class="comboMenu hidden"></div></div></div></div><div class="field"><label>البراند</label><div class="combo"><input id="brand" autocomplete="off" placeholder="اختياري"><button type="button" id="brandBtn" class="comboBtn">⌄</button><div id="brandMenu" class="comboMenu hidden"></div></div></div><div class="checks"><label class="check"><input id="offer" type="checkbox">عرض خاص</label><label class="check"><input id="featured" type="checkbox">منتج مميز</label><label class="check"><input id="active" type="checkbox" checked>متوفر</label></div><div class="field"><label>ملاحظة الخصم</label><input id="discount_note"></div><div class="field"><label>رابط الصورة الرئيسية *</label><input id="image" type="url" required><img id="preview" class="preview"></div><div class="field"><label>صور إضافية</label><textarea id="images" placeholder="رابط كل صورة في سطر"></textarea></div><div class="field optionBox"><label>خيارات يحددها الزبون</label><textarea id="options" placeholder="اللون: أسود | أبيض | أزرق&#10;الذاكرة: 128GB | 256GB | 512GB"></textarea><div class="help">اكتب كل خيار في سطر. يمكنك استخدام اللون، الذاكرة، الحجم، المقاس أو النوع.</div></div><div class="field"><label>الوصف</label><textarea id="desc"></textarea></div><button id="save" class="save" type="submit">+ إضافة المنتج</button><button id="cancel" class="cancel hidden" type="button">إلغاء التعديل</button><div id="status" class="status"></div></form></section><section id="brandsView" class="hidden"><iframe class="brandsFrame" src="brands-admin.html?v=4"></iframe></section></div><script>const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxKjSwjbAoe-uWiPOuAwgaeXQQYP0csZ6kOF7PwPszm0zFeG1hpyvoW2eAOpq1vHGKeQQ/exec';const $=id=>document.getElementById(id);let data=[],editing='',savedBrands=[];const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const truthy=v=>/^(1|true|yes|نعم|active)$/i.test(String(v||'').trim());const uniq=a=>[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));function parseCSV(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;r.push(v);v='';if(r.some(x=>x!==''))a.push(r);r=[]}else v+=c}r.push(v);if(r.some(x=>x!==''))a.push(r);const h=(a.shift()||[]).map(x=>x.trim().toLowerCase());return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,String(x[i]??'').trim()]))) }function show(v){$('listView').classList.toggle('hidden',v!=='list');$('formView').classList.toggle('hidden',v!=='form');$('brandsView').classList.toggle('hidden',v!=='brands');$('tabList').classList.toggle('active',v==='list');$('tabForm').classList.toggle('active',v==='form');$('tabBrands').classList.toggle('active',v==='brands')}function optionsFor(id){if(id==='category')return uniq(data.map(x=>x.category));if(id==='sub_category'){const c=$('category').value.trim();return uniq(data.filter(x=>!c||x.category===c).map(x=>x.sub_category))}return uniq([...data.map(x=>x.brand),...savedBrands.map(x=>x.name)])}function renderMenu(id,filter=''){const q=filter.trim().toLowerCase(),a=optionsFor(id).filter(x=>!q||x.toLowerCase().includes(q)),m=$(id+'Menu');m.innerHTML=a.length?a.map(x=>`<button type="button" class="comboOption" data-value="${esc(x)}">${esc(x)}</button>`).join(''):'<div class="comboEmpty">لا توجد نتائج — يمكنك كتابة اسم جديد</div>'}function toggleMenu(id,open){['category','sub_category','brand'].forEach(x=>{if(x!==id)$(x+'Menu').classList.add('hidden')});$(id+'Menu').classList.toggle('hidden',!open);if(open)renderMenu(id,$(id).value)}['category','sub_category','brand'].forEach(id=>{$(id+'Btn').onclick=()=>toggleMenu(id,$(id+'Menu').classList.contains('hidden'));$(id).onfocus=()=>{renderMenu(id,$(id).value)};$(id).oninput=()=>{renderMenu(id,$(id).value);toggleMenu(id,true);if(id==='category')renderMenu('sub_category','')};$(id+'Menu').onclick=e=>{const b=e.target.closest('[data-value]');if(!b)return;$(id).value=b.dataset.value;toggleMenu(id,false);if(id==='category'){$('sub_category').value='';renderMenu('sub_category','')}}});document.addEventListener('click',e=>{if(!e.target.closest('.combo'))['category','sub_category','brand'].forEach(id=>toggleMenu(id,false))});function render(){const q=$('search').value.trim().toLowerCase(),a=data.filter(x=>!q||[x.name,x.category,x.sub_category,x.brand].join(' ').toLowerCase().includes(q));$('count').textContent=a.length+' منتج';$('products').innerHTML=a.length?a.map(p=>`<div class="item"><img src="${esc(p.image)}" loading="lazy"><div><h3>${esc(p.name)}</h3><div class="meta">${esc([p.category,p.sub_category,p.brand].filter(Boolean).join(' • '))}<br>${esc(p.price)} د.ع${p.stock!==''?' • الكمية: '+esc(p.stock):''}${p.options?' • خيارات متاحة':''}</div></div><button class="edit" data-id="${esc(p.id)}">تعديل</button></div>`).join(''):'لا توجد نتائج'}async function loadBrands(){try{const r=await fetch(SCRIPT_URL+'?action=brands&_='+Date.now(),{cache:'no-store'}),j=await r.json();savedBrands=Array.isArray(j.brands)?j.brands:[]}catch(e){savedBrands=[]}}async function load(){try{await loadBrands();const r=await fetch(CSV_URL+'&t='+Date.now(),{cache:'no-store'});data=parseCSV(await r.text()).filter(x=>x.id||x.name);render();renderMenu('category');renderMenu('sub_category');renderMenu('brand')}catch(e){$('products').textContent='تعذر تحميل المنتجات — اضغط ↻'}}function reset(){editing='';$('form').reset();$('active').checked=true;$('stock').value=1;$('id').value='';$('save').textContent='+ إضافة المنتج';$('cancel').classList.add('hidden');$('preview').style.display='none';$('status').className='status'}function edit(p){editing=p.id;$('id').value=p.id;$('name').value=p.name||'';$('price').value=p.price||'';$('old_price').value=p.old_price||'';$('stock').value=p.stock===''?1:p.stock;$('category').value=p.category||'';$('sub_category').value=p.sub_category||'';$('brand').value=p.brand||'';$('offer').checked=truthy(p.offer);$('featured').checked=truthy(p.featured);$('active').checked=!p.active||truthy(p.active);$('discount_note').value=p.discount_note||'';$('image').value=p.image||'';$('images').value=(p.images||'').split('|').join('\n');$('options').value=(p.options||'').split(';').join('\n');$('desc').value=p.desc||'';$('save').textContent='حفظ التعديلات';$('cancel').classList.remove('hidden');if(p.image){$('preview').src=p.image;$('preview').style.display='block'}show('form');scrollTo(0,0)}$('image').oninput=e=>{if(e.target.value){$('preview').src=e.target.value;$('preview').style.display='block'}else $('preview').style.display='none'};$('tabList').onclick=()=>show('list');$('tabForm').onclick=()=>{reset();show('form')};$('tabBrands').onclick=()=>show('brands');$('cancel').onclick=()=>{reset();show('list')};$('refresh').onclick=load;$('search').oninput=render;$('products').onclick=e=>{const b=e.target.closest('[data-id]');if(b){const p=data.find(x=>x.id===b.dataset.id);if(p)edit(p)}};$('form').onsubmit=async e=>{e.preventDefault();const wasEditing=!!editing,s={action:wasEditing?'update':'add',id:editing||'',name:$('name').value.trim(),price:$('price').value,old_price:$('old_price').value,stock:String(Math.max(0,Number($('stock').value)||0)),category:$('category').value.trim(),sub_category:$('sub_category').value.trim(),brand:$('brand').value.trim(),offer:$('offer').checked?'نعم':'',featured:$('featured').checked?'نعم':'',active:$('active').checked?'نعم':'لا',discount_note:$('discount_note').value.trim(),image:$('image').value.trim(),images:$('images').value.trim().split(/\n+/).filter(Boolean).join('|'),options:$('options').value.trim().split(/\n+/).map(x=>x.trim()).filter(Boolean).join(';'),desc:$('desc').value.trim()};$('save').disabled=true;$('status').textContent='جاري الحفظ...';$('status').className='status wait';try{await fetch(SCRIPT_URL,{method:'POST',body:new URLSearchParams(s),mode:'no-cors',keepalive:true});$('status').textContent='✓ تم إرسال الحفظ';$('status').className='status ok';setTimeout(async()=>{reset();show('list');await load();$('save').disabled=false},900)}catch(err){$('status').textContent='تعذر الحفظ. تحقق من الإنترنت.';$('status').className='status err';$('save').disabled=false}};load();</script></body></html>
