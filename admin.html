<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f4ed"><title>إدارة معرض الفردوس</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.container{width:min(920px,calc(100% - 24px));margin:18px auto 50px}.head{text-align:center;margin-bottom:15px}.head img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:16px;padding:5px}.head h1{margin:8px 0 3px;font-size:24px}.head p{margin:0;color:#777;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;z-index:20;background:#f7f4ed;padding:6px 0}.tab{border:1px solid #e3ddd2;background:#fff;border-radius:14px;padding:13px;font-weight:800}.tab.active{background:#11100e;color:#fff}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}.hidden{display:none!important}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.refresh{width:48px;border:0;border-radius:12px;background:#111;color:#fff;font-size:19px}.products{display:grid;gap:10px}.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #eee7dc;border-radius:16px;padding:10px}.item img{width:64px;height:64px;object-fit:contain;background:#f7f7f7;border-radius:12px}.item h3{margin:0 0 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#777}.edit{border:0;border-radius:11px;background:#111;color:#fff;padding:9px 12px;font-weight:700}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #e1ddd5;border-radius:13px;padding:12px 13px;font:inherit;font-size:16px;background:#fff}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.check{display:flex;align-items:center;gap:7px;background:#faf8f4;border:1px solid #eee6d8;border-radius:12px;padding:11px}.check input{width:18px;height:18px}.save,.cancel{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}.save{background:#111;color:#fff}.cancel{background:#eee9df;margin-top:8px}.status{margin-top:12px;text-align:center;padding:11px;border-radius:12px;display:none}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.err{display:block;background:#ffebeb;color:#b42318}.count{font-size:12px;color:#777;margin-bottom:10px}.preview{display:none;width:120px;height:120px;object-fit:contain;background:#f7f7f7;border-radius:12px;margin-top:8px}@media(max-width:600px){.row{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.item{grid-template-columns:58px minmax(0,1fr)}.item img{width:58px;height:58px}.edit{grid-column:1/-1;width:100%}}</style></head><body><div class="container"><div class="head"><img src="icons/firdaws-logo.svg" alt=""><h1>إدارة معرض الفردوس</h1><p>إضافة وتعديل المنتجات من الهاتف مباشرة</p></div><div class="tabs"><button id="tabList" class="tab active">المنتجات الحالية</button><button id="tabForm" class="tab">+ إضافة منتج</button></div><section id="listView" class="card"><div class="toolbar"><input id="search" type="search" placeholder="ابحث باسم المنتج أو القسم أو البراند"><button id="refresh" class="refresh">↻</button></div><div id="count" class="count"></div><div id="products" class="products">جاري التحميل...</div></section><section id="formView" class="card hidden"><form id="form"><input id="id" type="hidden"><div class="field"><label>اسم المنتج *</label><input id="name" required></div><div class="row"><div class="field"><label>السعر *</label><input id="price" type="number" min="0" required></div><div class="field"><label>السعر القديم</label><input id="old_price" type="number" min="0"></div></div><div class="field"><label>الكمية</label><input id="stock" type="number" min="0" value="1"></div><div class="row"><div class="field"><label>القسم الرئيسي *</label><input id="category" list="categories" required><datalist id="categories"></datalist></div><div class="field"><label>القسم الفرعي</label><input id="sub_category" list="subs"><datalist id="subs"></datalist></div></div><div class="field"><label>البراند</label><input id="brand" list="brands"><datalist id="brands"></datalist></div><div class="checks"><label class="check"><input id="offer" type="checkbox">عرض خاص</label><label class="check"><input id="featured" type="checkbox">منتج مميز</label><label class="check"><input id="active" type="checkbox" checked>متوفر</label></div><div class="field"><label>ملاحظة الخصم</label><input id="discount_note"></div><div class="field"><label>رابط الصورة الرئيسية *</label><input id="image" type="url" required><img id="preview" class="preview"></div><div class="field"><label>صور إضافية</label><textarea id="images" placeholder="رابط كل صورة في سطر"></textarea></div><div class="field"><label>الوصف</label><textarea id="desc"></textarea></div><button id="save" class="save" type="submit">+ إضافة المنتج</button><button id="cancel" class="cancel hidden" type="button">إلغاء التعديل</button><div id="status" class="status"></div></form></section></div><script>const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';const SCRIPT_URL=localStorage.getItem('firdaws_script_url')||'';const $=x=>document.getElementById(x);let data=[],editing='';function parseCSV(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);v='';if(r.some(x=>x.trim()))a.push(r);r=[]}else v+=c}r.push(v);if(r.some(x=>x.trim()))a.push(r);let h=(a.shift()||[]).map(x=>x.trim().toLowerCase());return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const truthy=v=>/^(1|true|yes|نعم|active)$/i.test(String(v||'').trim());function show(v){$('listView').classList.toggle('hidden',v!=='list');$('formView').classList.toggle('hidden',v!=='form');$('tabList').classList.toggle('active',v==='list');$('tabForm').classList.toggle('active',v==='form')}function suggestions(){const fill=(id,vals)=>$(id).innerHTML=[...new Set(vals.filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join('');fill('categories',data.map(x=>x.category));fill('subs',data.map(x=>x.sub_category));fill('brands',data.map(x=>x.brand))}async function load(){try{let r=await fetch(CSV_URL+(CSV_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});data=parseCSV(await r.text()).filter(x=>x.id||x.name);suggestions();render()}catch(e){$('products').textContent='تعذر تحميل المنتجات'}}function render(){let q=$('search').value.trim().toLowerCase(),a=data.filter(x=>!q||[x.name,x.category,x.sub_category,x.brand].join(' ').toLowerCase().includes(q));$('count').textContent=a.length+' منتج';$('products').innerHTML=a.length?a.map(p=>`<div class="item"><img src="${esc(p.image)}"><div><h3>${esc(p.name)}</h3><div class="meta">${esc([p.category,p.sub_category,p.brand].filter(Boolean).join(' • '))}<br>${esc(p.price)} د.ع</div></div><button class="edit" data-id="${esc(p.id)}">تعديل</button></div>`).join(''):'لا توجد نتائج'}function reset(){editing='';$('form').reset();$('active').checked=true;$('stock').value=1;$('id').value='';$('save').textContent='+ إضافة المنتج';$('cancel').classList.add('hidden');$('preview').style.display='none';$('status').className='status'}function edit(p){editing=p.id;$('id').value=p.id;$('name').value=p.name||'';$('price').value=p.price||'';$('old_price').value=p.old_price||'';$('stock').value=p.stock||0;$('category').value=p.category||'';$('sub_category').value=p.sub_category||'';$('brand').value=p.brand||'';$('offer').checked=truthy(p.offer);$('featured').checked=truthy(p.featured);$('active').checked=!p.active||truthy(p.active);$('discount_note').value=p.discount_note||'';$('image').value=p.image||'';$('images').value=(p.images||'').split('|').join('\n');$('desc').value=p.desc||'';$('save').textContent='حفظ التعديلات';$('cancel').classList.remove('hidden');if(p.image){$('preview').src=p.image;$('preview').style.display='block'}show('form');scrollTo(0,0)}$('image').oninput=e=>{if(e.target.value){$('preview').src=e.target.value;$('preview').style.display='block'}};$('tabList').onclick=()=>show('list');$('tabForm').onclick=()=>{reset();show('form')};$('cancel').onclick=()=>{reset();show('list')};$('refresh').onclick=load;$('search').oninput=render;$('products').onclick=e=>{let b=e.target.closest('[data-id]');if(b){let p=data.find(x=>x.id===b.dataset.id);if(p)edit(p)}};$('form').onsubmit=async e=>{e.preventDefault();if(!SCRIPT_URL){$('status').textContent='يلزم أولاً ربط رابط Apps Script الخاص بالفردوس.';$('status').className='status err';return}let body=new URLSearchParams({action:editing?'update':'add',id:editing||'',name:$('name').value.trim(),price:$('price').value,old_price:$('old_price').value,stock:$('stock').value,category:$('category').value.trim(),sub_category:$('sub_category').value.trim(),brand:$('brand').value.trim(),offer:$('offer').checked?'نعم':'',featured:$('featured').checked?'نعم':'',active:$('active').checked?'نعم':'لا',discount_note:$('discount_note').value.trim(),image:$('image').value.trim(),images:$('images').value.trim().split(/\n+/).filter(Boolean).join('|'),desc:$('desc').value.trim()});$('save').disabled=true;try{await fetch(SCRIPT_URL,{method:'POST',body,mode:'no-cors'});$('status').textContent='تم إرسال الحفظ بنجاح';$('status').className='status ok';setTimeout(async()=>{await load();reset();show('list')},1200)}catch(err){$('status').textContent='تعذر الحفظ';$('status').className='status err'}$('save').disabled=false};load()</script></body></html>
