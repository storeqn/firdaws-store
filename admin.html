<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="إدارة الفردوس"><meta name="theme-color" content="#f7f4ed"><link rel="manifest" href="admin-manifest.json?v=6"><link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png?v=6"><title>إدارة معرض الفردوس</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.container{width:min(920px,calc(100% - 24px));margin:18px auto 50px}.head{text-align:center;margin-bottom:15px}.head img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:16px;padding:5px}.head h1{margin:8px 0 3px;font-size:24px}.head p{margin:0;color:#777;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;z-index:20;background:#f7f4ed;padding:6px 0}.tab{border:1px solid #e3ddd2;background:#fff;border-radius:14px;padding:13px 7px;font-weight:800;font:inherit}.tab.active{background:#11100e;color:#fff}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}.hidden{display:none!important}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.refresh{width:48px;border:0;border-radius:12px;background:#111;color:#fff;font-size:19px}.products{display:grid;gap:10px}.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #eee7dc;border-radius:16px;padding:10px}.item img{width:64px;height:64px;object-fit:contain;background:#f7f7f7;border-radius:12px}.item h3{margin:0 0 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#777;line-height:1.7}.soldMeta{color:#b42318;font-weight:800}.edit{border:0;border-radius:11px;background:#111;color:#fff;padding:9px 12px;font-weight:700}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,textarea{width:100%;border:1px solid #e1ddd5;border-radius:13px;padding:12px 13px;font:inherit;font-size:16px;background:#fff}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.check{display:flex;align-items:center;gap:7px;background:#faf8f4;border:1px solid #eee6d8;border-radius:12px;padding:11px}.check input{width:18px;height:18px}.save,.cancel{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}.save{background:#111;color:#fff}.save:disabled{opacity:.6}.cancel{background:#eee9df;margin-top:8px}.status{margin-top:12px;text-align:center;padding:11px;border-radius:12px;display:none}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.wait{display:block;background:#fff8e8;color:#6b521f}.status.err{display:block;background:#ffebeb;color:#b42318}.count{font-size:12px;color:#777;margin-bottom:10px}.preview{display:none;width:120px;height:120px;object-fit:contain;background:#f7f7f7;border-radius:12px;margin-top:8px}.brandHint{display:flex;align-items:center;gap:10px;background:#faf8f4;border:1px solid #eee6d8;border-radius:13px;padding:10px;margin-top:8px;color:#777;font-size:12px}.brandHint img{width:64px;height:44px;object-fit:contain;background:#fff;border-radius:9px}.combo{position:relative}.combo input{padding-left:52px}.comboBtn{position:absolute;left:3px;top:3px;bottom:3px;width:44px;border:0;border-radius:10px;background:#f5f1e9;font-size:20px}.comboMenu{position:absolute;z-index:100;top:calc(100% + 5px);right:0;left:0;max-height:240px;overflow:auto;background:#fff;border:1px solid #e1ddd5;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:5px}.comboOption{width:100%;border:0;background:#fff;text-align:right;padding:12px;border-radius:9px;font:inherit}.comboEmpty{padding:12px;color:#888;text-align:center;font-size:13px}.brandsFrame{width:100%;height:1100px;border:0;border-radius:22px;background:#f7f4ed}@media(max-width:600px){.row{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.item{grid-template-columns:58px minmax(0,1fr)}.item img{width:58px;height:58px}.edit{grid-column:1/-1;width:100%}.tab{font-size:12px;padding:11px 4px}.brandsFrame{height:1250px}}</style></head><body><div class="container"><div class="head"><img src="icons/firdaws-logo.svg" alt=""><h1>إدارة معرض الفردوس</h1><p>إدارة المنتجات وشعارات البراندات من الهاتف</p></div><div class="tabs"><button id="tabList" class="tab active">المنتجات الحالية</button><button id="tabForm" class="tab">+ إضافة منتج</button><button id="tabBrands" class="tab">🏷️ شعارات البراندات</button></div><section id="listView" class="card"><div class="toolbar"><input id="search" type="search" placeholder="ابحث باسم المنتج أو القسم أو البراند"><button id="refresh" class="refresh">↻</button></div><div id="count" class="count"></div><div id="products" class="products">جاري التحميل...</div></section><section id="formView" class="card hidden"><form id="form"><input id="id" type="hidden"><div class="field"><label>اسم المنتج *</label><input id="name" required></div><div class="row"><div class="field"><label>السعر *</label><input id="price" type="number" min="0" required></div><div class="field"><label>السعر القديم</label><input id="old_price" type="number" min="0"></div></div><div class="field"><label>الكمية</label><input id="stock" type="number" min="0" value="1"><div style="font-size:12px;color:#777;margin-top:6px">عند كتابة 0 سيظهر «نفدت الكمية».</div></div><div class="row"><div class="field"><label>القسم الرئيسي *</label><div class="combo"><input id="category" required autocomplete="off" placeholder="اختر أو اكتب قسمًا"><button id="categoryBtn" class="comboBtn" type="button">⌄</button><div id="categoryMenu" class="comboMenu hidden"></div></div></div><div class="field"><label>القسم الفرعي</label><div class="combo"><input id="sub_category" autocomplete="off" placeholder="اختر أو اكتب قسمًا فرعيًا"><button id="sub_categoryBtn" class="comboBtn" type="button">⌄</button><div id="sub_categoryMenu" class="comboMenu hidden"></div></div></div></div><div class="field"><label>البراند</label><div class="combo"><input id="brand" autocomplete="off" placeholder="اختر أو اكتب براندًا"><button id="brandBtn" class="comboBtn" type="button">⌄</button><div id="brandMenu" class="comboMenu hidden"></div></div><div id="brandHint" class="brandHint hidden"><img id="brandHintImg"><span id="brandHintText"></span></div></div><div class="checks"><label class="check"><input id="offer" type="checkbox">عرض خاص</label><label class="check"><input id="featured" type="checkbox">منتج مميز</label><label class="check"><input id="active" type="checkbox" checked>متوفر</label></div><div class="field"><label>ملاحظة الخصم</label><input id="discount_note"></div><div class="field"><label>رابط الصورة الرئيسية *</label><input id="image" type="url" required><img id="preview" class="preview"></div><div class="field"><label>صور إضافية</label><textarea id="images" placeholder="رابط كل صورة في سطر"></textarea></div><div class="field"><label>الوصف</label><textarea id="desc"></textarea></div><button id="save" class="save" type="submit">+ إضافة المنتج</button><button id="cancel" class="cancel hidden" type="button">إلغاء التعديل</button><div id="status" class="status"></div></form></section><section id="brandsView" class="hidden"><iframe id="brandsFrame" class="brandsFrame" title="شعارات البراندات" src="brands-admin.html?v=4"></iframe></section></div><script>const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxKjSwjbAoe-uWiPOuAwgaeXQQYP0csZ6kOF7PwPszm0zFeG1hpyvoW2eAOpq1vHGKeQQ/exec';const CACHE='firdaws_admin_products_v4',BRAND_CACHE='firdaws_brands_cache_v1';const $=x=>document.getElementById(x);let data=[],editing='',categoryOptions=[],subOptions=[],brandOptions=[],savedBrands=[];function parseCSV(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);v='';if(r.some(x=>x.trim()))a.push(r);r=[]}else v+=c}r.push(v);if(r.some(x=>x.trim()))a.push(r);let h=(a.shift()||[]).map(x=>x.trim().toLowerCase());return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const truthy=v=>/^(1|true|yes|نعم|active)$/i.test(String(v||'').trim());const uniq=a=>[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));function show(v){$('listView').classList.toggle('hidden',v!=='list');$('formView').classList.toggle('hidden',v!=='form');$('brandsView').classList.toggle('hidden',v!=='brands');$('tabList').classList.toggle('active',v==='list');$('tabForm').classList.toggle('active',v==='form');$('tabBrands').classList.toggle('active',v==='brands')}function refreshOptions(){categoryOptions=uniq(data.map(x=>x.category));brandOptions=uniq([...data.map(x=>x.brand),...savedBrands.map(x=>x.name)]);let c=$('category').value.trim();subOptions=uniq(data.filter(x=>!c||x.category===c).map(x=>x.sub_category));renderCombo('category',categoryOptions);renderCombo('sub_category',subOptions);renderCombo('brand',brandOptions)}function renderCombo(id,opts,filter=''){let m=$(id+'Menu'),q=filter.trim().toLowerCase(),a=opts.filter(v=>!q||v.toLowerCase().includes(q));m.innerHTML=a.length?a.map(v=>`<button type="button" class="comboOption" data-value="${esc(v)}">${esc(v)}</button>`).join(''):'<div class="comboEmpty">لا توجد نتائج — يمكنك كتابة اسم جديد</div>'}function toggleCombo(id,open){['category','sub_category','brand'].forEach(x=>{if(x!==id)$(x+'Menu').classList.add('hidden')});let m=$(id+'Menu');m.classList.toggle('hidden',!open);if(open)renderCombo(id,id==='category'?categoryOptions:id==='sub_category'?subOptions:brandOptions,$(id).value)}function updateBrandHint(){let key=$('brand').value.trim().toLowerCase(),b=savedBrands.find(x=>String(x.name||'').trim().toLowerCase()===key);$('brandHint').classList.toggle('hidden',!b||!b.logo);if(b&&b.logo){$('brandHintImg').src=b.logo;$('brandHintText').textContent='سيتم استخدام هذا الشعار تلقائيًا لهذا البراند.'}}['category','sub_category','brand'].forEach(id=>{$(id+'Btn').onclick=()=>toggleCombo(id,$(id+'Menu').classList.contains('hidden'));$(id).oninput=()=>{if(id==='category'){let c=$('category').value.trim();subOptions=uniq(data.filter(x=>!c||x.category===c).map(x=>x.sub_category));renderCombo('sub_category',subOptions)}if(id==='brand')updateBrandHint();renderCombo(id,id==='category'?categoryOptions:id==='sub_category'?subOptions:brandOptions,$(id).value);toggleCombo(id,true)};$(id+'Menu').onclick=e=>{let b=e.target.closest('[data-value]');if(!b)return;$(id).value=b.dataset.value;toggleCombo(id,false);if(id==='category'){let c=$('category').value.trim();subOptions=uniq(data.filter(x=>!c||x.category===c).map(x=>x.sub_category))}if(id==='brand')updateBrandHint()}});document.addEventListener('click',e=>{if(!e.target.closest('.combo'))['category','sub_category','brand'].forEach(id=>toggleCombo(id,false))});function setData(rows){data=rows;try{localStorage.setItem(CACHE,JSON.stringify(rows));localStorage.setItem('firdaws_products_v6',JSON.stringify(rows))}catch{}refreshOptions();render()}function showCached(){try{let c=JSON.parse(localStorage.getItem(CACHE)||localStorage.getItem('firdaws_products_v6')||'[]');if(Array.isArray(c)&&c.length){data=c;refreshOptions();render();return true}}catch{}return false}async function withTimeout(p,ms=2500){let t;return Promise.race([p,new Promise((_,rej)=>t=setTimeout(()=>rej(new Error('timeout')),ms))]).finally(()=>clearTimeout(t))}async function loadBrands(){try{let r=await withTimeout(fetch(SCRIPT_URL+'?action=brands&_='+Date.now(),{cache:'no-store'}),2500),j=await r.json();savedBrands=Array.isArray(j.brands)?j.brands:[];try{localStorage.setItem(BRAND_CACHE,JSON.stringify(savedBrands))}catch{}refreshOptions();updateBrandHint()}catch{try{let c=JSON.parse(localStorage.getItem(BRAND_CACHE)||'[]');if(Array.isArray(c))savedBrands=c}catch{}}}async function fetchFresh(){let r=await withTimeout(fetch(CSV_URL+'&t='+Date.now(),{cache:'no-store'}),3500),fresh=parseCSV(await r.text()).filter(x=>x.id||x.name);if(fresh.length)setData(fresh);return fresh}async function load(){let had=showCached();loadBrands();try{let f=await fetchFresh();if(!f.length&&!had&&!data.length){$('count').textContent='0 منتج';$('products').textContent='لا توجد نتائج'}}catch{if(!had&&!data.length)$('products').textContent='تعذر التحديث — اضغط ↻';else $('count').textContent=data.length+' منتج • نسخة محفوظة'}}function render(){let q=$('search').value.trim().toLowerCase(),a=data.filter(x=>!q||[x.name,x.category,x.sub_category,x.brand].join(' ').toLowerCase().includes(q));$('count').textContent=a.length+' منتج';$('products').innerHTML=a.length?a.map(p=>`<div class="item"><img src="${esc(p.image)}" loading="lazy" decoding="async"><div><h3>${esc(p.name)}</h3><div class="meta">${esc([p.category,p.sub_category,p.brand].filter(Boolean).join(' • '))}<br>${esc(p.price)} د.ع${Number(p.stock)===0?' • <span class="soldMeta">نفدت الكمية</span>':p.stock!==''?' • الكمية: '+esc(p.stock):''}</div></div><button class="edit" data-id="${esc(p.id)}">تعديل</button></div>`).join(''):'لا توجد نتائج'}function reset(){editing='';$('form').reset();$('active').checked=true;$('stock').value=1;$('id').value='';$('save').textContent='+ إضافة المنتج';$('cancel').classList.add('hidden');$('preview').style.display='none';$('brandHint').classList.add('hidden');$('status').className='status';refreshOptions()}function edit(p){editing=p.id;$('id').value=p.id;$('name').value=p.name||'';$('price').value=p.price||'';$('old_price').value=p.old_price||'';$('stock').value=p.stock===''?1:p.stock;$('category').value=p.category||'';$('sub_category').value=p.sub_category||'';$('brand').value=p.brand||'';$('offer').checked=truthy(p.offer);$('featured').checked=truthy(p.featured);$('active').checked=!p.active||truthy(p.active);$('discount_note').value=p.discount_note||'';$('image').value=p.image||'';$('images').value=(p.images||'').split('|').join('\n');$('desc').value=p.desc||'';$('save').textContent='حفظ التعديلات';$('cancel').classList.remove('hidden');if(p.image){$('preview').src=p.image;$('preview').style.display='block'}refreshOptions();updateBrandHint();show('form');scrollTo(0,0)}$('image').oninput=e=>{if(e.target.value){$('preview').src=e.target.value;$('preview').style.display='block'}else $('preview').style.display='none'};$('tabList').onclick=()=>show('list');$('tabForm').onclick=()=>{reset();show('form')};$('tabBrands').onclick=()=>show('brands');$('cancel').onclick=()=>{reset();show('list')};$('refresh').onclick=load;$('search').oninput=render;$('products').onclick=e=>{let b=e.target.closest('[data-id]');if(b){let p=data.find(x=>x.id===b.dataset.id);if(p)edit(p)}};function optimisticRow(s){let id=s.id||('pending-'+Date.now());let row={...s,id,images:s.images,active:s.active};if(editing){let i=data.findIndex(x=>String(x.id)===String(editing));if(i>=0)data[i]={...data[i],...row,id:editing};else data.unshift({...row,id:editing})}else data.unshift(row);setData(data.slice())}$('form').onsubmit=async e=>{e.preventDefault();let wasEditing=!!editing,s={action:wasEditing?'update':'add',id:editing||'',name:$('name').value.trim(),price:$('price').value,old_price:$('old_price').value,stock:String(Math.max(0,Number($('stock').value)||0)),category:$('category').value.trim(),sub_category:$('sub_category').value.trim(),brand:$('brand').value.trim(),offer:$('offer').checked?'نعم':'',featured:$('featured').checked?'نعم':'',active:$('active').checked?'نعم':'لا',discount_note:$('discount_note').value.trim(),image:$('image').value.trim(),images:$('images').value.trim().split(/\n+/).filter(Boolean).join('|'),desc:$('desc').value.trim()};$('save').disabled=true;$('status').textContent='جاري إرسال الحفظ...';$('status').className='status wait';try{await fetch(SCRIPT_URL,{method:'POST',body:new URLSearchParams(s),mode:'no-cors',keepalive:true});optimisticRow(s);$('status').textContent='✓ تم الحفظ';$('status').className='status ok';setTimeout(()=>{reset();show('list')},180);setTimeout(()=>fetchFresh().catch(()=>{}),1800)}catch{$('status').textContent='تعذر الحفظ';$('status').className='status err';$('save').disabled=false}};showCached();load();</script></body></html>
