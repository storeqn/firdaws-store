<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إدارة البراندات | معرض الفردوس</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:20px auto 50px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}h1{font-size:23px;margin:0 0 6px}p{color:#777;margin:0 0 18px}.field{margin-bottom:14px}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}input{width:100%;border:1px solid #e1ddd5;border-radius:13px;padding:13px 14px;font:inherit;font-size:16px;outline:none}input:focus{border-color:#b68b3d}.preview{display:none;width:120px;height:80px;object-fit:contain;border:1px solid #eee;border-radius:12px;margin-top:8px;background:#fafafa}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.secondary,.edit,.delete{border:0;border-radius:13px;padding:13px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#11100e;color:#fff}.secondary{background:#eee9df;color:#171512}.status{display:none;margin:12px 0;padding:11px;border-radius:12px;text-align:center;font-weight:700}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.err{display:block;background:#ffebeb;color:#b42318}.toolbar{display:flex;gap:8px;margin:18px 0 10px}.toolbar input{flex:1}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:10px;align-items:center;border:1px solid #eee7dc;border-radius:15px;padding:9px}.item img{width:72px;height:52px;object-fit:contain;background:#fafafa;border-radius:10px}.name{font-weight:800;overflow:hidden;text-overflow:ellipsis}.url{font-size:11px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source{font-size:11px;color:#9a7a3b;margin-top:3px}.edit{background:#11100e;color:#fff;padding:9px 11px}.delete{background:#fff0f0;color:#a52222;padding:9px 11px}.empty{text-align:center;color:#777;padding:25px}.hint{font-size:12px;color:#777;line-height:1.6;margin-top:5px}.combo{position:relative}.combo input{padding-left:52px}.comboBtn{position:absolute;left:3px;top:3px;bottom:3px;width:45px;border:0;border-radius:10px;background:transparent;font-size:20px;color:#171512;cursor:pointer}.comboBtn.open{transform:rotate(180deg)}.comboMenu{position:absolute;z-index:100;top:calc(100% + 5px);right:0;left:0;max-height:280px;overflow:auto;background:#fff;border:1px solid #e1ddd5;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:5px}.comboMenu.hidden{display:none}.comboOption{width:100%;border:0;background:#fff;text-align:right;padding:12px;border-radius:9px;font-family:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}.comboOption:hover{background:#f4efe7}.comboOption small{color:#999;font-size:11px}.comboEmpty{padding:12px;color:#888;text-align:center;font-size:13px}@media(max-width:560px){.item{grid-template-columns:58px minmax(0,1fr) auto}.item img{width:58px;height:46px}.delete{grid-column:2/4}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>إدارة البراندات والشعارات</h1>
<p>اختر أي براند مستخدم في المنتجات لإضافة شعاره، أو اكتب اسم براند جديد.</p>
<form id="brandForm">
<div class="field"><label>اسم البراند *</label><div class="combo"><input id="brandName" required placeholder="ابحث في البراندات أو اكتب براند جديد" autocomplete="off"><button id="brandNameBtn" class="comboBtn" type="button" aria-label="عرض البراندات">⌄</button><div id="brandNameMenu" class="comboMenu hidden"></div></div><div class="hint">السهم يعرض البراندات المستخدمة في المنتجات + البراندات التي أضفت لها شعارات.</div></div>
<div class="field"><label>رابط صورة الشعار *</label><input id="brandLogo" type="url" required placeholder="https://..."><img id="preview" class="preview" alt="معاينة الشعار"><div class="hint">يفضل WebP أو PNG بخلفية شفافة وحجم صغير.</div></div>
<div class="actions"><button id="saveBtn" class="primary" type="submit">حفظ البراند</button><button id="cancelBtn" class="secondary" type="button" hidden>إلغاء التعديل</button></div><div id="status" class="status"></div>
</form>
<div class="toolbar"><input id="search" type="search" placeholder="ابحث عن براند..."><button id="refresh" class="secondary" type="button">↻</button></div>
<div id="list" class="list"><div class="empty">جاري تحميل البراندات...</div></div>
</div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxKjSwjbAoe-uWiPOuAwgaeXQQYP0csZ6kOF7PwPszm0zFeG1hpyvoW2eAOpq1vHGKeQQ/exec";
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv";
const $=id=>document.getElementById(id);let brands=[],editing="";
function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function status(msg,type){const e=$("status");e.textContent=msg;e.className="status "+type}function clearStatus(){$("status").className="status"}
function parseCSV(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell="";continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell="";if(row.some(v=>v!==""))rows.push(row);row=[];continue}cell+=c}row.push(cell);if(row.some(v=>v!==""))rows.push(row);if(!rows.length)return[];const h=rows.shift().map(x=>x.trim().toLowerCase());return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]??"").trim()]))) }
function mergeBrands(saved,productNames){const map=new Map();productNames.forEach(name=>{name=String(name||"").trim();if(name)map.set(name.toLowerCase(),{name,logo:"",source:"product"})});saved.forEach(b=>{const name=String(b.name||"").trim();if(!name)return;map.set(name.toLowerCase(),{name,logo:String(b.logo||"").trim(),source:"saved"})});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"ar"))}
function brandOptions(filter=""){const q=String(filter||"").trim().toLowerCase();return brands.filter(b=>!q||b.name.toLowerCase().includes(q))}
function renderBrandMenu(filter=""){const arr=brandOptions(filter);$("brandNameMenu").innerHTML=arr.length?arr.map(b=>`<button type="button" class="comboOption" data-brand-choice="${esc(b.name)}"><span>${esc(b.name)}</span><small>${b.logo?"له شعار":"من المنتجات"}</small></button>`).join(""):'<div class="comboEmpty">لا توجد نتائج — يمكنك كتابة براند جديد</div>'}
function toggleBrandMenu(force){const menu=$("brandNameMenu"),btn=$("brandNameBtn"),open=force===undefined?menu.classList.contains("hidden"):force;menu.classList.toggle("hidden",!open);btn.classList.toggle("open",open);if(open)renderBrandMenu($("brandName").value)}
function chooseBrand(name){const b=brands.find(x=>x.name===name);if(!b)return;editing=b.logo?b.name:"";$("brandName").value=b.name;$("brandLogo").value=b.logo||"";$("preview").src=b.logo||"";$("preview").style.display=b.logo?"block":"none";$("cancelBtn").hidden=false;$("saveBtn").textContent=b.logo?"حفظ التعديل":"إضافة الشعار";toggleBrandMenu(false);clearStatus()}
async function load(){try{const savedReq=fetch(API_URL+(API_URL.includes("?")?"&":"?")+"action=brands&_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).catch(()=>({brands:[]}));const productReq=CSV_URL?fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>parseCSV(t).map(p=>p.brand).filter(Boolean)).catch(()=>[]):Promise.resolve([]);const [savedData,productNames]=await Promise.all([savedReq,productReq]);brands=mergeBrands(Array.isArray(savedData.brands)?savedData.brands:[],productNames);render();renderBrandMenu($("brandName").value)}catch(e){console.error(e);$("list").innerHTML='<div class="empty">تعذر تحميل البراندات.</div>'}}
function render(){const q=$("search").value.trim().toLowerCase(),arr=brands.filter(b=>!q||b.name.toLowerCase().includes(q));$("list").innerHTML=arr.length?arr.map(b=>`<div class="item"><img src="${esc(b.logo||'logo.svg')}" loading="lazy" decoding="async" onerror="this.src='logo.svg'"><div><div class="name">${esc(b.name)}</div><div class="url">${b.logo?esc(b.logo):'لا يوجد شعار بعد'}</div><div class="source">${b.logo?'شعار محفوظ':'مستخدم في المنتجات'}</div></div><button class="edit" type="button" data-edit="${esc(b.name)}">${b.logo?'تعديل':'إضافة شعار'}</button>${b.logo?`<button class="delete" type="button" data-delete="${esc(b.name)}">حذف</button>`:''}</div>`).join(""):'<div class="empty">لا توجد براندات بعد.</div>'}
function reset(){editing="";$("brandForm").reset();$("preview").style.display="none";$("cancelBtn").hidden=true;$("saveBtn").textContent="حفظ البراند";toggleBrandMenu(false);clearStatus()}
$("brandNameBtn").addEventListener("click",()=>toggleBrandMenu());$("brandName").addEventListener("input",e=>{const v=e.target.value;if(!brands.some(b=>b.name.toLowerCase()===v.trim().toLowerCase()&&b.logo))editing="";renderBrandMenu(v);toggleBrandMenu(true)});$("brandNameMenu").addEventListener("click",e=>{const b=e.target.closest("[data-brand-choice]");if(b)chooseBrand(b.dataset.brandChoice)});document.addEventListener("click",e=>{if(!e.target.closest(".combo"))toggleBrandMenu(false)});
$("brandLogo").addEventListener("input",e=>{const u=e.target.value.trim();$("preview").src=u;$("preview").style.display=u?"block":"none"});$("search").addEventListener("input",render);$("refresh").addEventListener("click",load);$("cancelBtn").addEventListener("click",reset);
$("list").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(edit){chooseBrand(edit.dataset.edit);window.scrollTo({top:0,behavior:"smooth"})}if(del){if(!confirm("حذف شعار البراند "+del.dataset.delete+"؟"))return;const d=new URLSearchParams({action:"brand_delete",name:del.dataset.delete});try{await fetch(API_URL,{method:"POST",body:d,mode:"no-cors"});setTimeout(load,500)}catch(_){status("تعذر الحذف","err")}}});
$("brandForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("saveBtn"),name=$("brandName").value.trim(),logo=$("brandLogo").value.trim();btn.disabled=true;btn.textContent="جاري الحفظ...";const d=new URLSearchParams({action:"brand_upsert",name,logo});if(editing)d.append("old_name",editing);try{await fetch(API_URL,{method:"POST",body:d,mode:"no-cors"});status("✅ تم إرسال بيانات البراند للحفظ","ok");reset();setTimeout(load,500)}catch(err){console.error(err);status("❌ تعذر الحفظ","err")}btn.disabled=false;btn.textContent="حفظ البراند"});
load();
</script>
</body>
</html>
