<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>شعارات البراندات | معرض الفردوس</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:18px auto 50px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}h1{font-size:23px;margin:0 0 6px}p{color:#777;margin:0 0 18px;line-height:1.7}.field{margin-bottom:14px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;border:1px solid #e1ddd5;border-radius:13px;padding:13px 14px;font:inherit;font-size:16px}.preview{display:none;width:120px;height:80px;object-fit:contain;border:1px solid #eee;border-radius:12px;margin-top:8px;background:#fafafa}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.secondary,.edit,.delete{border:0;border-radius:13px;padding:13px 15px;font:inherit;font-weight:800}.primary{background:#11100e;color:#fff}.secondary{background:#eee9df}.status{display:none;margin:12px 0;padding:11px;border-radius:12px;text-align:center;font-weight:800}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.err{display:block;background:#ffebeb;color:#b42318}.status.wait{display:block;background:#fff8e8;color:#6b521f}.toolbar{display:flex;gap:8px;margin:18px 0 10px}.toolbar input{flex:1}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:10px;align-items:center;border:1px solid #eee7dc;border-radius:15px;padding:9px}.item img{width:72px;height:52px;object-fit:contain;background:#fafafa;border-radius:10px}.name{font-weight:800}.url{font-size:11px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{background:#11100e;color:#fff;padding:9px 11px}.delete{background:#fff0f0;color:#a52222;padding:9px 11px}.empty{text-align:center;color:#777;padding:25px}.combo{position:relative}.combo input{padding-left:52px}.comboBtn{position:absolute;left:3px;top:3px;bottom:3px;width:45px;border:0;border-radius:10px;background:#f5f1e9;font-size:20px}.comboMenu{position:absolute;z-index:100;top:calc(100% + 5px);right:0;left:0;max-height:280px;overflow:auto;background:#fff;border:1px solid #e1ddd5;border-radius:13px;padding:5px}.hidden{display:none!important}.comboOption{width:100%;border:0;background:#fff;text-align:right;padding:12px;border-radius:9px;font:inherit}.comboEmpty{padding:12px;color:#888;text-align:center;font-size:13px}@media(max-width:560px){.item{grid-template-columns:58px minmax(0,1fr) auto}.item img{width:58px;height:46px}.delete{grid-column:2/4}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>شعارات البراندات</h1><p>أضف شعار كل براند مرة واحدة. يظهر الحفظ فورًا وتتم المزامنة في الخلفية.</p><form id="brandForm"><div class="field"><label>اسم البراند *</label><div class="combo"><input id="brandName" required autocomplete="off" placeholder="اختر براند أو اكتب اسمًا جديدًا"><button id="brandBtn" class="comboBtn" type="button">⌄</button><div id="brandMenu" class="comboMenu hidden"></div></div></div><div class="field"><label>رابط صورة الشعار *</label><input id="brandLogo" type="url" required placeholder="https://..."><img id="preview" class="preview"></div><div class="actions"><button id="saveBtn" class="primary" type="submit">حفظ البراند</button><button id="cancelBtn" class="secondary" type="button" hidden>إلغاء</button></div><div id="status" class="status"></div></form><div class="toolbar"><input id="search" type="search" placeholder="ابحث عن براند..."><button id="refresh" class="secondary" type="button">↻</button></div><div id="list" class="list"></div></div></div><script>
const API_URL='https://script.google.com/macros/s/AKfycbxKjSwjbAoe-uWiPOuAwgaeXQQYP0csZ6kOF7PwPszm0zFeG1hpyvoW2eAOpq1vHGKeQQ/exec',CACHE_KEY='firdaws_brands_cache_v3';const $=id=>document.getElementById(id);let brands=[],editing='';const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function status(m,t){$('status').textContent=m;$('status').className='status '+t}function clearStatus(){$('status').className='status'}function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(brands))}catch{}}function bootstrap(){try{brands=JSON.parse(localStorage.getItem(CACHE_KEY)||'[]');if(!Array.isArray(brands))brands=[]}catch{brands=[]}render();renderMenu()}function renderMenu(f=''){let q=f.trim().toLowerCase(),a=brands.filter(b=>!q||b.name.toLowerCase().includes(q));$('brandMenu').innerHTML=a.length?a.map(b=>`<button type="button" class="comboOption" data-name="${esc(b.name)}">${esc(b.name)}${b.logo?' ✓':''}</button>`).join(''):'<div class="comboEmpty">لا توجد نتائج — يمكنك كتابة اسم جديد</div>'}function toggle(o){$('brandMenu').classList.toggle('hidden',!o);if(o)renderMenu($('brandName').value)}function setPreview(u){u=String(u||'').trim();if(!u){$('preview').style.display='none';return}$('preview').src=u;$('preview').style.display='block'}function render(){let q=$('search').value.trim().toLowerCase(),a=brands.filter(b=>!q||b.name.toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(b=>`<div class="item"><img src="${esc(b.logo||'logo.svg')}" loading="lazy" onerror="this.src='logo.svg'"><div><div class="name">${esc(b.name)}</div><div class="url">${b.logo?esc(b.logo):'لا يوجد شعار بعد'}</div></div><button class="edit" type="button" data-edit="${esc(b.name)}">${b.logo?'تعديل':'إضافة شعار'}</button>${b.logo?`<button class="delete" type="button" data-delete="${esc(b.name)}">حذف</button>`:''}</div>`).join(''):'<div class="empty">لا توجد براندات محفوظة بعد</div>'}function choose(n){let b=brands.find(x=>x.name===n);if(!b)return;editing=b.logo?b.name:'';$('brandName').value=b.name;$('brandLogo').value=b.logo||'';setPreview(b.logo);$('cancelBtn').hidden=false;$('saveBtn').textContent=b.logo?'حفظ التعديل':'إضافة الشعار';toggle(false);clearStatus()}function reset(){editing='';$('brandForm').reset();setPreview('');$('cancelBtn').hidden=true;$('saveBtn').textContent='حفظ البراند';toggle(false)}function sendAction(p){let u=new URL(API_URL);Object.entries(p).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v)!=='')u.searchParams.set(k,String(v))});u.searchParams.set('_',Date.now());let i=new Image();i.src=u.toString()}async function refresh(){try{let r=await fetch(API_URL+'?action=brands&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(Array.isArray(j.brands)){let names=new Map(brands.map(b=>[b.name.toLowerCase(),b]));j.brands.forEach(b=>names.set(String(b.name).toLowerCase(),b));brands=[...names.values()];render();renderMenu();saveCache()}}catch{}}
$('brandBtn').onclick=()=>toggle($('brandMenu').classList.contains('hidden'));$('brandName').oninput=e=>{renderMenu(e.target.value);toggle(true)};$('brandMenu').onclick=e=>{let b=e.target.closest('[data-name]');if(b)choose(b.dataset.name)};$('brandLogo').oninput=e=>setPreview(e.target.value);$('search').oninput=render;$('refresh').onclick=refresh;$('cancelBtn').onclick=reset;document.addEventListener('click',e=>{if(!e.target.closest('.combo'))toggle(false)});$('list').onclick=e=>{let ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed){choose(ed.dataset.edit);scrollTo(0,0)}if(del){let n=del.dataset.delete;if(!confirm('حذف شعار '+n+'؟'))return;sendAction({action:'brand_delete',name:n});brands=brands.map(b=>b.name===n?{...b,logo:''}:b);saveCache();render();status('✅ تم حذف الشعار','ok');setTimeout(refresh,1000)}};$('brandForm').onsubmit=e=>{e.preventDefault();let name=$('brandName').value.trim(),logo=$('brandLogo').value.trim();if(!name||!logo)return;sendAction({action:'brand_upsert',name,logo,old_name:editing});let old=(editing||name).toLowerCase(),idx=brands.findIndex(b=>b.name.toLowerCase()===old||b.name.toLowerCase()===name.toLowerCase());if(idx>=0)brands[idx]={name,logo};else brands.push({name,logo});brands.sort((a,b)=>a.name.localeCompare(b.name,'ar'));saveCache();render();renderMenu();status('✅ تم حفظ الشعار','ok');$('saveBtn').disabled=false;setTimeout(()=>{reset();refresh()},600)};bootstrap();setTimeout(refresh,150);
</script></body></html>
