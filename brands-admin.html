<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شعارات البراندات | معرض الفردوس</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#171512;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:18px auto 50px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.07)}h1{font-size:22px;margin:0 0 6px}p{color:#777;margin:0 0 18px;font-size:13px;line-height:1.7}.field{margin-bottom:14px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;border:1px solid #e1ddd5;border-radius:13px;padding:13px 14px;font:inherit;font-size:16px;outline:none}.preview{display:none;width:120px;height:78px;object-fit:contain;border:1px solid #eee;border-radius:12px;margin-top:8px;background:#fafafa}.previewError{display:none;margin-top:8px;font-size:12px;color:#b42318}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.secondary,.edit,.delete{border:0;border-radius:13px;padding:13px 15px;font:inherit;font-weight:800}.primary{background:#11100e;color:#fff}.secondary{background:#eee9df;color:#171512}.status{display:none;margin:12px 0;padding:11px;border-radius:12px;text-align:center;font-weight:700}.status.ok{display:block;background:#e7f8ed;color:#16743a}.status.err{display:block;background:#ffebeb;color:#b42318}.status.wait{display:block;background:#fff8e8;color:#6b521f}.toolbar{display:flex;gap:8px;margin:18px 0 10px}.toolbar input{flex:1}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:10px;align-items:center;border:1px solid #eee7dc;border-radius:15px;padding:9px}.logoBox{width:72px;height:52px;background:#fafafa;border-radius:10px;display:grid;place-items:center;overflow:hidden;border:1px solid #f2eee7}.logoBox img{width:100%;height:100%;object-fit:contain}.logoFallback{display:none;font-size:11px;color:#999;text-align:center;padding:4px;line-height:1.3}.logoBox.broken img{display:none}.logoBox.broken .logoFallback{display:block}.name{font-weight:800}.url{font-size:11px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{background:#11100e;color:#fff;padding:9px 11px}.delete{background:#fff0f0;color:#a52222;padding:9px 11px}.empty{text-align:center;color:#777;padding:25px}.combo{position:relative}.combo input{padding-left:52px}.comboBtn{position:absolute;left:3px;top:3px;bottom:3px;width:45px;border:0;border-radius:10px;background:#f5f1e9;font-size:20px}.comboMenu{position:absolute;z-index:100;top:calc(100% + 5px);right:0;left:0;max-height:280px;overflow:auto;background:#fff;border:1px solid #e1ddd5;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:5px}.hidden{display:none!important}.comboOption{width:100%;border:0;background:#fff;text-align:right;padding:12px;border-radius:9px;font:inherit}.comboEmpty{padding:12px;color:#888;text-align:center;font-size:13px}@media(max-width:560px){.item{grid-template-columns:58px minmax(0,1fr) auto}.logoBox{width:58px;height:46px}.delete{grid-column:2/4}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>شعارات البراندات</h1>
<p>أضف شعار كل براند مرة واحدة فقط. بعد الحفظ سيُستخدم الشعار تلقائيًا مع جميع منتجات نفس البراند.</p>
<form id="brandForm"><div class="field"><label>اسم البراند *</label><div class="combo"><input id="brandName" required autocomplete="off" placeholder="اختر براند أو اكتب اسمًا جديدًا"><button id="brandBtn" class="comboBtn" type="button">⌄</button><div id="brandMenu" class="comboMenu hidden"></div></div></div><div class="field"><label>رابط صورة الشعار *</label><input id="brandLogo" type="url" required placeholder="https://..."><img id="preview" class="preview" alt="معاينة الشعار"><div id="previewError" class="previewError">تعذر تحميل الصورة من هذا الرابط. جرّب رابط صورة مباشر.</div></div><div class="actions"><button id="saveBtn" class="primary" type="submit">حفظ البراند</button><button id="cancelBtn" class="secondary" type="button" hidden>إلغاء</button></div><div id="status" class="status"></div></form>
<div class="toolbar"><input id="search" type="search" placeholder="ابحث عن براند..."><button id="refresh" class="secondary" type="button">↻</button></div><div id="list" class="list"><div class="empty">جاري التحميل...</div></div>
</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxKjSwjbAoe-uWiPOuAwgaeXQQYP0csZ6kOF7PwPszm0zFeG1hpyvoW2eAOpq1vHGKeQQ/exec';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';
const $=id=>document.getElementById(id);let brands=[],editing='';
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeLogoUrl(value){let s=String(value||'').trim();if(!s)return'';try{let u=new URL(s);[...u.searchParams.keys()].forEach(k=>{if(/^utm_/i.test(k))u.searchParams.delete(k)});return u.toString()}catch{return s}}
function parseCSV(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);v='';if(r.some(x=>x.trim()))a.push(r);r=[]}else v+=c}r.push(v);if(r.some(x=>x.trim()))a.push(r);let h=(a.shift()||[]).map(x=>x.trim().toLowerCase());return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}
function status(m,t){$('status').textContent=m;$('status').className='status '+t}
function merge(saved,names){let map=new Map();names.forEach(n=>{n=String(n||'').trim();if(n)map.set(n.toLowerCase(),{name:n,logo:''})});saved.forEach(b=>{let n=String(b.name||'').trim();if(n)map.set(n.toLowerCase(),{name:n,logo:normalizeLogoUrl(b.logo)})});return[...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar'))}
function renderMenu(filter=''){let q=filter.trim().toLowerCase(),a=brands.filter(b=>!q||b.name.toLowerCase().includes(q));$('brandMenu').innerHTML=a.length?a.map(b=>`<button type="button" class="comboOption" data-name="${esc(b.name)}">${esc(b.name)}${b.logo?' ✓':''}</button>`).join(''):'<div class="comboEmpty">لا توجد نتائج — يمكنك كتابة اسم جديد</div>'}
function toggle(open){$('brandMenu').classList.toggle('hidden',!open);if(open)renderMenu($('brandName').value)}
function setPreview(url){url=normalizeLogoUrl(url);$('previewError').style.display='none';if(!url){$('preview').removeAttribute('src');$('preview').style.display='none';return}$('preview').style.display='block';$('preview').src=url}
$('preview').onload=()=>{$('previewError').style.display='none';$('preview').style.display='block'};$('preview').onerror=()=>{$('preview').style.display='none';$('previewError').style.display='block'};
function choose(name){let b=brands.find(x=>x.name===name);if(!b)return;editing=b.logo?b.name:'';$('brandName').value=b.name;$('brandLogo').value=b.logo||'';setPreview(b.logo||'');$('cancelBtn').hidden=false;$('saveBtn').textContent=b.logo?'حفظ التعديل':'إضافة الشعار';toggle(false)}
async function fetchSavedBrands(){let r=await fetch(API_URL+'?action=brands&_='+Date.now(),{cache:'no-store'});let j=await r.json();return Array.isArray(j.brands)?j.brands:[]}
async function callBrandAction(params){let u=new URL(API_URL);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v)!=='')u.searchParams.set(k,String(v))});u.searchParams.set('_',Date.now());let r=await fetch(u.toString(),{cache:'no-store'});let j=await r.json();if(!j||j.success!==true)throw new Error(j&&j.error?j.error:'تعذر تنفيذ الطلب');return j}
async function load(){try{let savedReq=fetchSavedBrands().catch(()=>[]);let prodReq=fetch(CSV_URL+'&_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>parseCSV(t).map(p=>p.brand).filter(Boolean)).catch(()=>[]);let[saved,names]=await Promise.all([savedReq,prodReq]);brands=merge(saved,names);render();renderMenu()}catch{$('list').innerHTML='<div class="empty">تعذر التحميل</div>'}}
function render(){let q=$('search').value.trim().toLowerCase(),a=brands.filter(b=>!q||b.name.toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(b=>{let logo=normalizeLogoUrl(b.logo);return `<div class="item"><div class="logoBox ${logo?'':'broken'}">${logo?`<img src="${esc(logo)}" alt="${esc(b.name)}" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('broken')">`:''}<div class="logoFallback">${logo?'تعذر تحميل الشعار':'لا يوجد شعار'}</div></div><div><div class="name">${esc(b.name)}</div><div class="url">${logo?esc(logo):'لا يوجد شعار بعد'}</div></div><button class="edit" type="button" data-edit="${esc(b.name)}">${logo?'تعديل':'إضافة شعار'}</button>${logo?`<button class="delete" type="button" data-delete="${esc(b.name)}">حذف</button>`:''}</div>`}).join(''):'<div class="empty">لا توجد براندات</div>'}
function reset(){editing='';$('brandForm').reset();setPreview('');$('cancelBtn').hidden=true;$('saveBtn').textContent='حفظ البراند';$('status').className='status';toggle(false)}
$('brandBtn').onclick=()=>toggle($('brandMenu').classList.contains('hidden'));$('brandName').oninput=e=>{renderMenu(e.target.value);toggle(true)};$('brandMenu').onclick=e=>{let b=e.target.closest('[data-name]');if(b)choose(b.dataset.name)};document.addEventListener('click',e=>{if(!e.target.closest('.combo'))toggle(false)});$('brandLogo').oninput=e=>setPreview(e.target.value);$('brandLogo').onblur=e=>{let clean=normalizeLogoUrl(e.target.value);if(clean&&clean!==e.target.value)e.target.value=clean;setPreview(clean)};$('search').oninput=render;$('refresh').onclick=load;$('cancelBtn').onclick=reset;
$('list').onclick=async e=>{let ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(ed){choose(ed.dataset.edit);scrollTo(0,0)}if(del){if(!confirm('حذف شعار '+del.dataset.delete+'؟'))return;status('جاري الحذف...','wait');try{await callBrandAction({action:'brand_delete',name:del.dataset.delete});status('✓ تم حذف الشعار','ok');await load()}catch(err){status('تعذر الحذف: '+err.message,'err')}}};
$('brandForm').onsubmit=async e=>{e.preventDefault();let name=$('brandName').value.trim(),logo=normalizeLogoUrl($('brandLogo').value);$('brandLogo').value=logo;if(!name||!logo)return;setPreview(logo);$('saveBtn').disabled=true;status('جاري حفظ الشعار...','wait');try{await callBrandAction({action:'brand_upsert',name,logo,old_name:editing});status('✓ تم حفظ الشعار بنجاح','ok');await load();setTimeout(reset,700)}catch(err){status('تعذر الحفظ: '+err.message,'err')}$('saveBtn').disabled=false};
load();
</script>
</body>
</html>
