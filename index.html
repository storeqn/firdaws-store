<style>
:root{--bg:#f7f4ed;--ink:#171512;--muted:#746f67;--line:#e9e2d5;--gold:#b68b3d;--gold2:#e3c47c;--dark:#11100e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.6;padding-bottom:96px}body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}button,input,textarea{font:inherit}.container{width:min(1180px,calc(100% - 28px));margin:auto}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:50;background:rgba(247,244,237,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(182,139,61,.12);padding-top:env(safe-area-inset-top)}.topbar-inner{min-height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.brand{display:flex;align-items:center;justify-content:center;gap:10px;color:inherit}.brand img{width:44px;height:44px;object-fit:contain;border-radius:50%;background:#fff}.brand span{font-weight:900;font-size:20px}.icon-btn{width:42px;height:42px;border:1px solid #fff;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border-radius:14px;display:grid;place-items:center;position:relative}.badge{position:absolute;top:-5px;left:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:20px;background:var(--gold);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800}.hero{padding-top:18px}.hero-card{min-height:285px;border-radius:30px;background:radial-gradient(circle at 15% 15%,rgba(227,196,124,.35),transparent 28%),linear-gradient(135deg,#181510,#2b2419);color:#fff;padding:42px}.hero-card h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:12px 0}.hero-card p{color:#eee6d8}.hero-card>button{border:0;margin-top:18px;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));font-weight:900}.brand-showcase{margin-top:24px;padding:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);backdrop-filter:blur(18px);-webkit-backdrop-filte 800;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.meta button{border:1px solid rgba(255,255,255,.92);background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.36));color:#8b6524;font:inherit;font-weight:900;padding:6px 10px;cursor:pointer;border-radius:999px;backdrop-filter:blur(14px) saturate(1.35);-webkit-backdrop-filter:blur(14px) saturate(1.35);box-shadow:0 4px 14px rgba(59,43,17,.08),inset 0 1px 0 rgba(255,255,255,.75);transition:.18s}.meta button:active{transform:scale(.96);background:rgba(255,255,255,.88)}.meta button:hover{text-decoration:none}.info>.meta{padding:10px;border:1px solid rgba(255,255,255,.82);background:rgba(247,244,237,.52);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(45,34,18,.07);margin-bottom:14px}.title{font-weight:900;font-size:16px;line-height:1.4}.price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}.price{font-size:18px;font-weight:900}.old{text-decoration:line-through;color:#999;font-size:13px}.note{font-size:11px;color:#9d6c11;font-weight:800}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.add,.details{border:0;border-radius:13px;padding:10px 12px;font-weight:800}.add{background:var(--dark);color:#fff;width:100%}.add:disabled{background:#aaa}.details{background:#fff;border:1px solid var(--line)}.qty-inline{height:42px;border:1px solid rgba(182,139,61,.45);background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-radius:13px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;overflow:hidden;box-shadow:inset 0 1px 0 #fff}.qty-inline button{height:100%;border:0;background:transparent;font-size:21px;font-weight:900}.qty-inline b{text-align:center;font-size:16px}.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.category-card{border:1px solid rgba(182,139,61,.15);background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-radius:22px;padding:22px 15px;text-align:center;min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 30px rgba(40,30,15,.05)}.category-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#f4ede1;color:#9b7028;font-size:23px}.category-card strong{font-size:15px}.category-card small{color:var(--muted)}.filter-block{margin:0 0 18px}.filter-label{font-weight:900;margin:10px 0 8px}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-radius:999px;padding:8px 13px;font-weight:800;color:#5d554a}.chip.active{background:#171512;color:#fff;border-color:#171512}.back-row{margin-bottom:14px}.back-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d6cbb6;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}dialog{border:0;padding:0;border-radius:26px;background:#fff;color:var(--ink);box-shadow:0 30px 90px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.58);backdrop-filter:blur(3px)}#productModal{width:min(920px,calc(100% - 18px));max-height:92dvh;overflow:auto}#cartModal{width:min(680px,calc(100% - 10px));max-height:94dvh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.close{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:22px}.detail{display:grid;grid-template-columns:1fr 1fr}.gallery{background:#faf8f3;padding:18px}.gallery img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:18px}.info{padding:30px}.desc{white-space:pre-wrap;background:#fbf9f5;border:1px solid var(--line);padding:14px;border-radius:14px;margin:15px 0}.sold-msg{background:#ffebeb;color:#b42318;padding:11px;border-radius:12px;font-weight:900;margin:12px 0}.cart-items{padding:10px 20px}.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.cart-item img{width:70px;height:70px;object-fit:contain;background:#faf8f3;border-radius:12px}.qty{display:flex;gap:6px;align-items:center;margin-top:5px}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px}.remove{border:0;background:transparent;color:#a34b3c}.summary{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}.checkout{display:grid;gap:10px;padding:0 20px max(28px,env(safe-area-inset-bottom))}.checkout input,.checkout textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px}.checkout button{border:0;background:#178a51;color:#fff;border-radius:14px;padding:14px;font-weight:900}.toast{position:fixed;z-index:120;bottom:104px;left:50%;transform:translate(-50%,20px);opacity:0;background:#181510;color:#fff;padding:10px 16px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{display:grid;position:fixed;z-index:60;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;grid-template-columns:repeat(4,1fr);min-height:68px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.68);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-radius:22px;box-shadow:0 14px 45px rgba(30,22,12,.16);overflow:hidden}.nav-btn{border:0;background:transparent;color:#696159;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}.nav-btn.active{color:#1d1812}.nav-btn.active::before{content:'';position:absolute;top:5px;width:32px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}.nav-icon{font-size:21px}.nav-btn small{font-size:10px;font-weight:800}.bottom b{position:absolute;top:6px;right:calc(50% - 25px);background:var(--gold);color:#fff;border-radius:20px;min-width:17px;height:17px;font-size:9px;display:grid;place-items:center}@media(max-width:920px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.hero{padding-top:12px}.hero-card{padding:25px 21px;min-height:250px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:11px}.title{font-size:14px}.price{font-size:16px}.actions{grid-template-columns:1fr}.details{display:none}.detail{grid-template-columns:1fr}.gallery{padding:12px}.info{padding:18px}.section{padding-top:32px}.category-grid{grid-template-columns:repeat(2,1fr)}.offer-strip .card{flex-basis:72vw}.brand-logo-btn{flex-basis:66px;height:54px}}
</style></head><body>
<header class="topbar"><div class="container topbar-inner"><button id="menuBtn" class="icon-btn">☰</button><button class="brand" id="brandHome" style="border:0;background:transparent"><img src="icons/firdaws-logo.svg" alt=""><span>معرض الفردوس</span></button><button id="cartBtn" class="icon-btn">🛒<span id="cartCount" class="badge">0</span></button></div></header>
<main><section id="homeView"><section class="hero container"><div class="hero-card"><h1>معرض الفردوس</h1><p>هواتف وأجهزة كهربائية ومنتجات مختارة، مع طلب مباشر وسريع عبر واتساب.</p><button id="shopNow">تسوّق الآن</button><div id="brandShowcase" class="brand-showcase hidden"><div id="brandLogos" class="brand-logo-strip"></div></div></div></section><div class="container search-wrap"><input id="q" class="search" type="search" placeholder="ابحث عن منتج، شركة أو قسم..."></div><section class="section container"><div class="section-head"><h2>العروض</h2><button id="allOffers" class="back-btn">عرض الكل</button></div><div id="homeOffers" class="offer-strip"></div></section><section class="section container"><div class="section-head"><h2>كل المنتجات</h2><span id="status" class="count">جاري التحميل...</span></div><div id="homeGrid" class="grid"><div class="empty">جاري تحميل المنتجات...</div></div></section></section>
<section id="categoriesView" class="hidden section container"><div class="section-head"><h2>الأقسام</h2><span class="count" id="categoryCount"></span></div><div id="categoryGrid" class="category-grid"></div></section>
<section id="productsView" class="hidden section container"><div class="back-row"><button id="backCategories" class="back-btn">← الرجوع للأقسام</button></div><div class="section-head"><h2 id="productsTitle">المنتجات</h2><span id="productsCount" class="count"></span></div><div id="categoryFilters" class="filter-block"></div><div id="productGrid" class="grid"></div></section>
<section id="offersView" class="hidden section container"><div class="section-head"><h2>كل العروض</h2><span id="offersCount" class="count"></span></div><div id="offersGrid" class="grid"></div></section></main>
<dialog id="productModal"><div class="modal-head"><strong>تفاصيل المنتج</strong><button class="close" data-close="productModal">×</button></div><div id="productContent"></div></dialog><dialog id="cartModal"><div class="modal-head"><strong>السلة</strong><button class="close" data-close="cartModal">×</button></div><div id="cartItems" class="cart-items"></div><div class="summary"><span>عدد القطع: <b id="cartPieces">0</b></span><strong id="cartTotal">0 د.ع</strong></div><form id="checkoutForm" class="checkout"><input id="customerName" placeholder="الاسم" required><input id="phone" type="tel" placeholder="رقم الهاتف" required><textarea id="address" placeholder="العنوان + أقرب نقطة" required></textarea><textarea id="note" placeholder="ملاحظات الطلب"></textarea><button>إرسال الطلب عبر واتساب</button></form></dialog><div id="toast" class="toast"></div>
<nav class="bottom"><button class="nav-btn active" data-view="home"><span class="nav-icon">⌂</span><small>الرئيسية</small></button><button class="nav-btn" data-view="categories"><span class="nav-icon">◫</span><small>الأقسام</small></button><button class="nav-btn" data-view="offers"><span class="nav-icon">✦</span><small>العروض</small></button><button class="nav-btn" id="bottomCartBtn"><span class="nav-icon">🛍</span><small>السلة</small><b id="bottomCartCount">0</b></button></nav>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';
const WA='9647719183122',CACHE='firdaws_products_v6',$=id=>document.getElementById(id);let products=[],selectedCategory='',selectedSub='',selectedBrand='',cart=JSON.parse(localStorage.getItem('firdaws_cart')||'{}'),lockedY=0;
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue}cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);if(!rows.length)return[];const headers=rows.shift().map(h=>String(h).trim().toLowerCase());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()]))) }
function num(v){const n=Number(String(v??'').replace(/[,،\s]/g,''));return Number.isFinite(n)?n:0}function truthy(v){return /^(1|true|yes|نعم)$/i.test(String(v||'').trim())}function inactive(v){return /^(0|false|no|لا|موقوف|inactive)$/i.test(String(v||'').trim())}function normalize(rows){return rows.map(x=>({id:String(x.id||'').trim(),name:String(x.name||'').trim(),price:num(x.price),old:num(x.old_price),offer:truthy(x.offer),note:x.discount_note||'',image:x.image||'',category:x.category||'غير مصنف',sub:x.sub_category||'',brand:x.brand||'',brandLogo:x.brand_logo||'',desc:x.desc||'',active:x.active||'',stock:x.stock===''||x.stock==null?null:Math.max(0,num(x.stock))})).filter(x=>x.id&&x.name&&!inactive(x.active))}
const sold=p=>p.stock!==null&&p.stock<=0,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>num(n).toLocaleString('ar-IQ');
function lockPage(){if(document.body.classList.contains('locked'))return;lockedY=window.scrollY;document.body.style.top=`-${lockedY}px`;document.body.classList.add('locked')}function unlockPage(){if(!document.body.classList.contains('locked'))return;document.body.classList.remove('locked');document.body.style.top='';window.scrollTo(0,lockedY)}function openDialog(id){lockPage();$(id).showModal()}function closeDialog(id){const d=$(id);if(d.open)d.close();if(!$('productModal').open&&!$('cartModal').open)unlockPage()}['productModal','cartModal'].forEach(id=>{$(id).addEventListener('cancel',e=>{e.preventDefault();closeDialog(id)});$(id).addEventListener('click',e=>{if(e.target===$(id))closeDialog(id)})});
function metaLinks(p){const a=[];if(p.category)a.push(`<button data-meta-category="${esc(p.category)}">${esc(p.category)}</button>`);if(p.sub)a.push(`<button data-meta-sub="${esc(p.sub)}" data-parent="${esc(p.category)}">${esc(p.sub)}</button>`);if(p.brand)a.push(`<button data-meta-brand="${esc(p.brand)}" data-parent="${esc(p.category)}">${esc(p.brand)}</button>`);return a.join('')}
function purchaseMarkup(p){const out=sold(p),qty=cart[p.id]||0;if(out)return '<button class="add" disabled>نفدت الكمية</button>';if(qty>0)return `<div class="qty-inline"><button data-qty-dec="${esc(p.id)}">−</button><b>${qty}</b><button data-qty-inc="${esc(p.id)}">+</button></div>`;return `<button class="add" data-add="${esc(p.id)}">+ أضف للسلة</button>`}
function card(p){const out=sold(p);return `<article class="card${out?' soldout':''}"><div class="image-wrap" data-open="${esc(p.id)}">${p.offer?'<span class="pill">عرض</span>':''}${out?'<span class="sold-pill">نفدت الكمية</span>':''}<img src="${esc(p.image)}" loading="lazy" alt="${esc(p.name)}"></div><div class="body"><div class="meta">${metaLinks(p)}</div><div class="title" data-open="${esc(p.id)}">${esc(p.name)}</div><div class="price-row"><span class="price">${money(p.price)} د.ع</span>${p.old>p.price?`<span class="old">${money(p.old)} د.ع</span>`:''}</div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}<div class="actions"><div data-purchase="${esc(p.id)}">${purchaseMarkup(p)}</div><button class="details" data-open="${esc(p.id)}">تفاصيل</button></div></div></article>`}
function renderBrands(){const seen=new Map();products.forEach(p=>{if(p.brand&&p.brandLogo&&!seen.has(p.brand))seen.set(p.brand,p.brandLogo)});const items=[...seen.entries()];$('brandLogos').innerHTML=items.map(([name,logo])=>`<button class="brand-logo-btn" data-home-brand="${esc(name)}" aria-label="${esc(name)}"><img src="${esc(logo)}" alt="${esc(name)}"></button>`).join('');$('brandShowcase').classList.toggle('hidden',!items.length)}
function renderHome(){const q=$('q').value.trim().toLowerCase();const list=products.filter(p=>!q||[p.name,p.category,p.sub,p.brand].join(' ').toLowerCase().includes(q));$('status').textContent=list.length+' منتج';$('homeGrid').innerHTML=list.map(card).join('')||'<div class="empty">لا توجد منتجات مطابقة.</div>';const offers=products.filter(p=>p.offer||p.old>p.price).slice(0,12);$('homeOffers').innerHTML=offers.map(card).join('')||'<div class="empty">لا توجد عروض حاليًا.</div>'}
function renderCategories(){const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];$('categoryCount').textContent=cats.length+' قسم';$('categoryGrid').innerHTML=cats.map((c,i)=>{const count=products.filter(p=>p.category===c).length,icons=['▦','◈','◇','▣','◉','⌁'];return `<button class="category-card" data-category="${esc(c)}"><span class="category-icon">${icons[i%icons.length]}</span><strong>${esc(c)}</strong><small>${count} منتج</small></button>`}).join('')||'<div class="empty">لا توجد أقسام.</div>'}
function renderFilters(){const base=selectedCategory?products.filter(p=>p.category===selectedCategory):products,subs=[...new Set(base.map(p=>p.sub).filter(Boolean))],brands=[...new Set(base.map(p=>p.brand).filter(Boolean))];let h='';if(selectedCategory&&subs.length)h+=`<div class="filter-label">الأقسام الفرعية</div><div class="chips"><button class="chip ${!selectedSub?'active':''}" data-sub="">الكل</button>${subs.map(s=>`<button class="chip ${selectedSub===s?'active':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;if(brands.length)h+=`<div class="filter-label">البراندات</div><div class="chips"><button class="chip ${!selectedBrand?'active':''}" data-brand="">الكل</button>${brands.map(b=>`<button class="chip ${selectedBrand===b?'active':''}" data-brand="${esc(b)}">${esc(b)}</button>`).join('')}</div>`;$('categoryFilters').innerHTML=h}
function renderSelectedCategory(){let list=selectedCategory?products.filter(p=>p.category===selectedCategory):products.slice();if(selectedSub)list=list.filter(p=>p.sub===selectedSub);if(selectedBrand)list=list.filter(p=>p.brand===selectedBrand);$('productsTitle').textContent=[selectedCategory,selectedSub,selectedBrand].filter(Boolean).join(' • ')||'المنتجات';$('productsCount').textContent=list.length+' منتج';renderFilters();$('productGrid').innerHTML=list.map(card).join('')||'<div class="empty">لا توجد منتجات مطابقة.</div>'}
function renderOffers(){const list=products.filter(p=>p.offer||p.old>p.price);$('offersCount').textContent=list.length+' عرض';$('offersGrid').innerHTML=list.map(card).join('')||'<div class="empty">لا توجد عروض حاليًا.</div>'}
function setView(view){['homeView','categoriesView','productsView','offersView'].forEach(id=>$(id).classList.add('hidden'));if(view==='home')$('homeView').classList.remove('hidden');if(view==='categories'){$('categoriesView').classList.remove('hidden');renderCategories()}if(view==='offers'){$('offersView').classList.remove('hidden');renderOffers()}document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));window.scrollTo(0,0)}
function openCategory(name,sub='',brand=''){selectedCategory=name;selectedSub=sub;selectedBrand=brand;renderSelectedCategory();['homeView','categoriesView','offersView'].forEach(id=>$(id).classList.add('hidden'));$('productsView').classList.remove('hidden');document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.remove('active'));window.scrollTo(0,0)}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const out=sold(p);$('productContent').innerHTML=`<div class="detail"><div class="gallery"><img src="${esc(p.image)}" alt="${esc(p.name)}" style="${out?'filter:grayscale(1);opacity:.55':''}"></div><div class="info"><div class="meta">${metaLinks(p)}</div><h2>${esc(p.name)}</h2><div class="price-row"><span class="price">${money(p.price)} د.ع</span>${p.old>p.price?`<span class="old">${money(p.old)} د.ع</span>`:''}</div>${out?'<div class="sold-msg">نفدت الكمية حاليًا</div>':''}${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}<div data-purchase="${esc(p.id)}">${purchaseMarkup(p)}</div></div></div>`;openDialog('productModal')}
function syncPurchase(id){const p=products.find(x=>x.id===id);if(!p)return;document.querySelectorAll(`[data-purchase="${CSS.escape(id)}"]`).forEach(el=>el.innerHTML=purchaseMarkup(p))}
function saveCart(){localStorage.setItem('firdaws_cart',JSON.stringify(cart));updateCart()}function add(id){const p=products.find(x=>x.id===id);if(!p||sold(p))return toast('نفدت الكمية');const current=cart[id]||0;if(p.stock!==null&&current>=p.stock)return toast('وصلت للكمية المتوفرة');cart[id]=current+1;saveCart();syncPurchase(id);toast('✓ تمت الإضافة للسلة')}function inlineInc(id){const p=products.find(x=>x.id===id);if(!p||sold(p))return;if(p.stock!==null&&(cart[id]||0)>=p.stock)return toast('وصلت للكمية المتوفرة');cart[id]=(cart[id]||0)+1;saveCart();syncPurchase(id)}function inlineDec(id){if(!cart[id])return;cart[id]--;if(cart[id]<=0)delete cart[id];saveCart();syncPurchase(id)}function cartItems(){return Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p?{...p,qty}:null}).filter(Boolean)}function updateCart(){const items=cartItems(),pieces=items.reduce((s,x)=>s+x.qty,0),total=items.reduce((s,x)=>s+x.qty*x.price,0);$('cartCount').textContent=pieces;$('bottomCartCount').textContent=pieces;$('cartPieces').textContent=pieces;$('cartTotal').textContent=money(total)+' د.ع'}
function openCart(){const items=cartItems();$('cartItems').innerHTML=items.length?items.map(x=>`<div class="cart-item"><img src="${esc(x.image)}"><div><strong>${esc(x.name)}</strong><div>${money(x.price)} د.ع</div><div class="qty"><button data-dec="${esc(x.id)}">−</button><b>${x.qty}</b><button data-inc="${esc(x.id)}">+</button></div></div><button class="remove" data-del="${esc(x.id)}">حذف</button></div>`).join(''):'<div class="empty">السلة فارغة</div>';updateCart();openDialog('cartModal')}function inc(id){const p=products.find(x=>x.id===id);if(!p||sold(p))return;if(p.stock!==null&&(cart[id]||0)>=p.stock)return toast('وصلت للكمية المتوفرة');cart[id]=(cart[id]||0)+1;saveCart();syncPurchase(id);openCart()}function dec(id){if(--cart[id]<=0)delete cart[id];saveCart();syncPurchase(id);openCart()}function del(id){delete cart[id];saveCart();syncPurchase(id);openCart()}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1400)}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)return closeDialog(close.dataset.close);const hb=e.target.closest('[data-home-brand]');if(hb)return openCategory('','',hb.dataset.homeBrand);const mc=e.target.closest('[data-meta-category]');if(mc){if($('productModal').open)closeDialog('productModal');return openCategory(mc.dataset.metaCategory)}const ms=e.target.closest('[data-meta-sub]');if(ms){if($('productModal').open)closeDialog('productModal');return openCategory(ms.dataset.parent,ms.dataset.metaSub,'')}const mb=e.target.closest('[data-meta-brand]');if(mb){if($('productModal').open)closeDialog('productModal');return openCategory(mb.dataset.parent,'',mb.dataset.metaBrand)}const qi=e.target.closest('[data-qty-inc]');if(qi)return inlineInc(qi.dataset.qtyInc);const qd=e.target.closest('[data-qty-dec]');if(qd)return inlineDec(qd.dataset.qtyDec);const sub=e.target.closest('[data-sub]');if(sub){selectedSub=sub.dataset.sub;return renderSelectedCategory()}const br=e.target.closest('[data-brand]');if(br){selectedBrand=br.dataset.brand;return renderSelectedCategory()}const open=e.target.closest('[data-open]');if(open)return openProduct(open.dataset.open);const addb=e.target.closest('[data-add]');if(addb&&!addb.disabled)return add(addb.dataset.add);const cat=e.target.closest('[data-category]');if(cat)return openCategory(cat.dataset.category);const i=e.target.closest('[data-inc]');if(i)return inc(i.dataset.inc);const d=e.target.closest('[data-dec]');if(d)return dec(d.dataset.dec);const r=e.target.closest('[data-del]');if(r)return del(r.dataset.del)});
document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('bottomCartBtn').onclick=openCart;$('cartBtn').onclick=openCart;$('brandHome').onclick=()=>setView('home');$('shopNow').onclick=()=>setView('categories');$('menuBtn').onclick=()=>setView('categories');$('allOffers').onclick=()=>setView('offers');$('backCategories').onclick=()=>setView('categories');$('q').addEventListener('input',renderHome);
$('checkoutForm').addEventListener('submit',e=>{e.preventDefault();const items=cartItems().filter(x=>!sold(x));if(!items.length)return toast('السلة فارغة');const n=$('customerName').value.trim(),p=$('phone').value.trim(),ad=$('address').value.trim(),nt=$('note').value.trim(),total=items.reduce((s,x)=>s+x.qty*x.price,0);let msg=`طلب جديد - معرض الفردوس\n\nالاسم: ${n}\nالهاتف: ${p}\nالعنوان: ${ad}\n`;if(nt)msg+=`ملاحظات: ${nt}\n`;msg+='\nالمنتجات:\n'+items.map((x,i)=>`${i+1}) ${x.name} | ${x.qty} × ${money(x.price)} = ${money(x.qty*x.price)} د.ع`).join('\n')+`\n\nالإجمالي: ${money(total)} د.ع`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank')});
function applyData(data){products=data;renderBrands();renderHome();renderCategories();updateCart()}function showCached(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'[]');if(Array.isArray(c)&&c.length)applyData(c)}catch{}}async function load(){showCached();try{const res=await fetch(CSV_URL,{cache:'default'});if(!res.ok)throw new Error();const fresh=normalize(parseCSV(await res.text()));if(fresh.length){localStorage.setItem(CACHE,JSON.stringify(fresh));applyData(fresh)}}catch(e){if(!products.length)$('homeGrid').innerHTML='<div class="empty">تعذر تحميل المنتجات.</div>'}}load();
</script></body></html>
