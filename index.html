<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معرض الفردوس</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f4ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f7f4ed;--ink:#171512;--muted:#746f67;--line:#e9e2d5;--gold:#b68b3d;--gold2:#e3c47c;--dark:#11100e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.6;padding-bottom:78px}body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}button,input,textarea{font:inherit}.container{width:min(1180px,calc(100% - 28px));margin:auto}.topbar{position:sticky;top:0;z-index:50;background:rgba(247,244,237,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(182,139,61,.13);padding-top:env(safe-area-inset-top)}.topbar-inner{min-height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.brand{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:inherit}.brand img{width:44px;height:44px;object-fit:contain;border-radius:50%;background:#fff}.brand span{font-weight:900;font-size:20px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;position:relative}.badge{position:absolute;top:-5px;left:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:20px;background:var(--gold);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800}.hero{padding-top:22px}.hero-card{min-height:300px;border-radius:30px;background:radial-gradient(circle at 15% 15%,rgba(227,196,124,.35),transparent 28%),linear-gradient(135deg,#181510,#2b2419);color:#fff;padding:44px;position:relative;overflow:hidden}.hero-card h1{font-size:clamp(38px,7vw,70px);line-height:1;margin:12px 0}.hero-card p{max-width:650px;color:#eee6d8}.hero-card a{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b160e;font-weight:900;text-decoration:none}.search-wrap{padding-top:18px}.search{width:100%;height:52px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0 16px;font-size:16px;outline:none}.section{padding-top:42px;scroll-margin-top:82px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.section-head h2{margin:0;font-size:28px}.count{font-size:13px;color:var(--muted)}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px}.chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}.image-wrap{aspect-ratio:1;position:relative;background:#faf8f3;overflow:hidden}.image-wrap img{width:100%;height:100%;object-fit:contain;display:block}.card.soldout .image-wrap img{filter:grayscale(1);opacity:.55}.pill{position:absolute;top:10px;right:10px;background:#17120b;color:#f6d891;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.sold-pill{position:absolute;top:10px;left:10px;background:#b42318;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.meta{font-size:12px;color:var(--gold);font-weight:800}.title{font-weight:900;font-size:16px;line-height:1.4}.price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}.price{font-size:18px;font-weight:900}.old{text-decoration:line-through;color:#999;font-size:13px}.note{font-size:11px;color:#9d6c11;font-weight:800}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.add,.details{border:0;border-radius:13px;padding:10px 12px;font-weight:800}.add{background:var(--dark);color:#fff}.add:disabled{background:#aaa}.details{background:#fff;border:1px solid var(--line)}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d6cbb6;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
dialog{border:0;padding:0;border-radius:26px;background:#fff;color:var(--ink);box-shadow:0 30px 90px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.58);backdrop-filter:blur(3px)}#productModal{width:min(920px,calc(100% - 18px));max-height:92dvh;overflow:auto}#cartModal{width:min(680px,calc(100% - 10px));max-height:94dvh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.close{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:22px}.detail{display:grid;grid-template-columns:1fr 1fr}.gallery{background:#faf8f3;padding:18px}.gallery img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:18px}.info{padding:30px}.info h2{margin:5px 0 12px}.desc{white-space:pre-wrap;background:#fbf9f5;border:1px solid var(--line);padding:14px;border-radius:14px;margin:15px 0}.sold-msg{background:#ffebeb;color:#b42318;padding:11px;border-radius:12px;font-weight:900;margin:12px 0}.cart-items{padding:10px 20px}.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.cart-item img{width:70px;height:70px;object-fit:contain;background:#faf8f3;border-radius:12px}.qty{display:flex;gap:6px;align-items:center;margin-top:5px}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px}.remove{border:0;background:transparent;color:#a34b3c}.summary{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}.checkout{display:grid;gap:10px;padding:0 20px max(28px,env(safe-area-inset-bottom))}.checkout input,.checkout textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px}.checkout button{border:0;background:#178a51;color:#fff;border-radius:14px;padding:14px;font-weight:900}.toast{position:fixed;z-index:120;bottom:90px;left:50%;transform:translate(-50%,20px);opacity:0;background:#181510;color:#fff;padding:10px 16px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);grid-template-columns:repeat(4,1fr);min-height:66px}.bottom a,.bottom button{border:0;background:transparent;text-decoration:none;color:#4f4a43;display:grid;place-items:center;align-content:center;position:relative}.bottom b{position:absolute;top:5px;right:calc(50% - 25px);background:var(--gold);color:#fff;border-radius:20px;min-width:17px;height:17px;font-size:9px;display:grid;place-items:center}
@media(max-width:920px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.hero{padding-top:12px}.hero-card{padding:26px 22px;min-height:260px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:11px}.title{font-size:14px}.price{font-size:16px}.actions{grid-template-columns:1fr}.details{display:none}.detail{grid-template-columns:1fr}.gallery{padding:12px}.info{padding:18px}.bottom{display:grid}.section{padding-top:34px}}
</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner"><button id="menuBtn" class="icon-btn">☰</button><a class="brand" href="#home"><img src="icons/firdaws-logo.svg" alt=""><span>معرض الفردوس</span></a><button id="cartBtn" class="icon-btn">🛒<span id="cartCount" class="badge">0</span></button></div></header>
<main id="home">
<section class="hero container"><div class="hero-card"><h1>معرض الفردوس</h1><p>هواتف وأجهزة كهربائية ومنتجات مختارة، مع طلب مباشر وسريع عبر واتساب.</p><a href="#products">تسوّق الآن</a></div></section>
<div class="container search-wrap"><input id="q" class="search" type="search" placeholder="ابحث عن منتج، شركة أو قسم..."></div>
<section class="section container" id="offers"><div class="section-head"><h2>العروض</h2></div><div id="offersGrid" class="grid"></div></section>
<section class="section container" id="products"><div class="section-head"><h2>كل المنتجات</h2><span id="status" class="count">جاري التحميل...</span></div><div id="cats" class="chips"></div><div id="subs" class="chips"></div><div id="brands" class="chips"></div><div id="grid" class="grid"><div class="empty">جاري تحميل المنتجات...</div></div></section>
</main>
<dialog id="productModal"><div class="modal-head"><strong>تفاصيل المنتج</strong><button class="close" data-close="productModal">×</button></div><div id="productContent"></div></dialog>
<dialog id="cartModal"><div class="modal-head"><strong>السلة</strong><button class="close" data-close="cartModal">×</button></div><div id="cartItems" class="cart-items"></div><div class="summary"><span>عدد القطع: <b id="cartPieces">0</b></span><strong id="cartTotal">0 د.ع</strong></div><form id="checkoutForm" class="checkout"><input id="customerName" placeholder="الاسم" required><input id="phone" type="tel" placeholder="رقم الهاتف" required><textarea id="address" placeholder="العنوان + أقرب نقطة" required></textarea><textarea id="note" placeholder="ملاحظات الطلب"></textarea><button>إرسال الطلب عبر واتساب</button></form></dialog>
<div id="toast" class="toast"></div>
<nav class="bottom"><a href="#home">⌂<small>الرئيسية</small></a><a href="#products">▦<small>الأقسام</small></a><a href="#offers">★<small>العروض</small></a><button id="bottomCartBtn">🛒<small>السلة</small><b id="bottomCartCount">0</b></button></nav>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vToXcV323xvYtiuz6tg-d0q_f2iwOwnYBpCRqAgSnarQ2PYVZ9Z1GJKlSmftjuajtlJ6zBfmVbRwArp/pub?output=csv';
const WA='9647719183122',CACHE='firdaws_products_v4',$=id=>document.getElementById(id);
let products=[],category='',sub='',brand='',cart=JSON.parse(localStorage.getItem('firdaws_cart')||'{}'),lockedY=0;
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue}cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);if(!rows.length)return[];const headers=rows.shift().map(h=>String(h).trim().toLowerCase());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()]))) }
function num(v){const n=Number(String(v??'').replace(/[,،\s]/g,''));return Number.isFinite(n)?n:0}
function truthy(v){return /^(1|true|yes|نعم)$/i.test(String(v||'').trim())}
function inactive(v){return /^(0|false|no|لا|موقوف|inactive)$/i.test(String(v||'').trim())}
function normalize(rows){return rows.map(x=>({id:String(x.id||'').trim(),name:String(x.name||'').trim(),price:num(x.price),old:num(x.old_price),offer:truthy(x.offer),note:x.discount_note||'',image:x.image||'',category:x.category||'غير مصنف',sub:x.sub_category||'',brand:x.brand||'',desc:x.desc||'',active:x.active||'',stock:x.stock===''||x.stock==null?null:Math.max(0,num(x.stock))})).filter(x=>x.id&&x.name&&!inactive(x.active))}
const sold=p=>p.stock!==null&&p.stock<=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>num(n).toLocaleString('ar-IQ');
function lockPage(){if(document.body.classList.contains('locked'))return;lockedY=window.scrollY;document.body.style.top=`-${lockedY}px`;document.body.classList.add('locked')}
function unlockPage(){if(!document.body.classList.contains('locked'))return;document.body.classList.remove('locked');document.body.style.top='';window.scrollTo(0,lockedY)}
function openDialog(id){lockPage();$(id).showModal()}
function closeDialog(id){const d=$(id);if(d.open)d.close();if(!$('productModal').open&&!$('cartModal').open)unlockPage()}
['productModal','cartModal'].forEach(id=>{$(id).addEventListener('cancel',e=>{e.preventDefault();closeDialog(id)});$(id).addEventListener('click',e=>{if(e.target===$(id))closeDialog(id)})});
document.addEventListener('click',e=>{const b=e.target.closest('[data-close]');if(b)closeDialog(b.dataset.close)});
function saveCart(){localStorage.setItem('firdaws_cart',JSON.stringify(cart));updateCart()}
function chip(text,on,fn){const b=document.createElement('button');b.className='chip'+(on?' active':'');b.textContent=text;b.type='button';b.onclick=fn;return b}
function filters(){const cats=$('cats');cats.innerHTML='';cats.append(chip('الكل',!category,()=>{category=sub=brand='';render()}));[...new Set(products.map(p=>p.category).filter(Boolean))].forEach(v=>cats.append(chip(v,category===v,()=>{category=v;sub=brand='';render()})));const subs=$('subs');subs.innerHTML='';[...new Set(products.filter(p=>!category||p.category===category).map(p=>p.sub).filter(Boolean))].forEach(v=>subs.append(chip(v,sub===v,()=>{sub=sub===v?'':v;brand='';render()})));const brands=$('brands');brands.innerHTML='';[...new Set(products.filter(p=>(!category||p.category===category)&&(!sub||p.sub===sub)).map(p=>p.brand).filter(Boolean))].forEach(v=>brands.append(chip(v,brand===v,()=>{brand=brand===v?'':v;render()})))}
function visibleProducts(){const q=$('q').value.trim().toLowerCase();return products.filter(p=>(!category||p.category===category)&&(!sub||p.sub===sub)&&(!brand||p.brand===brand)&&(!q||[p.name,p.category,p.sub,p.brand].join(' ').toLowerCase().includes(q)))}
function card(p){const out=sold(p);return `<article class="card${out?' soldout':''}"><div class="image-wrap" data-open="${esc(p.id)}">${p.offer?'<span class="pill">عرض</span>':''}${out?'<span class="sold-pill">نفدت الكمية</span>':''}<img src="${esc(p.image)}" loading="lazy" alt="${esc(p.name)}"></div><div class="body"><div class="meta">${esc([p.category,p.sub,p.brand].filter(Boolean).join(' • '))}</div><div class="title" data-open="${esc(p.id)}">${esc(p.name)}</div><div class="price-row"><span class="price">${money(p.price)} د.ع</span>${p.old>p.price?`<span class="old">${money(p.old)} د.ع</span>`:''}</div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}<div class="actions"><button class="add" data-add="${esc(p.id)}" ${out?'disabled':''}>${out?'نفدت الكمية':'+ أضف للسلة'}</button><button class="details" data-open="${esc(p.id)}">تفاصيل</button></div></div></article>`}
function render(){filters();const list=visibleProducts();$('status').textContent=list.length+' منتج';$('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">لا توجد منتجات مطابقة.</div>';const offers=products.filter(p=>p.offer||p.old>p.price).slice(0,8);$('offersGrid').innerHTML=offers.length?offers.map(card).join(''):'<div class="empty">لا توجد عروض حاليًا.</div>';updateCart()}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const out=sold(p);$('productContent').innerHTML=`<div class="detail"><div class="gallery"><img src="${esc(p.image)}" alt="${esc(p.name)}" style="${out?'filter:grayscale(1);opacity:.55':''}"></div><div class="info"><div class="meta">${esc([p.category,p.sub,p.brand].filter(Boolean).join(' • '))}</div><h2>${esc(p.name)}</h2><div class="price-row"><span class="price">${money(p.price)} د.ع</span>${p.old>p.price?`<span class="old">${money(p.old)} د.ع</span>`:''}</div>${out?'<div class="sold-msg">نفدت الكمية حاليًا</div>':''}${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}<button class="add" data-add="${esc(p.id)}" ${out?'disabled':''}>${out?'نفدت الكمية':'+ أضف للسلة'}</button></div></div>`;openDialog('productModal')}
function add(id){const p=products.find(x=>x.id===id);if(!p||sold(p))return toast('نفدت الكمية');const current=cart[id]||0;if(p.stock!==null&&current>=p.stock)return toast('وصلت للكمية المتوفرة');cart[id]=current+1;saveCart();toast('✓ تمت الإضافة للسلة')}
function cartItems(){return Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p?{...p,qty}:null}).filter(Boolean)}
function updateCart(){const items=cartItems(),pieces=items.reduce((s,x)=>s+x.qty,0),total=items.reduce((s,x)=>s+x.qty*x.price,0);$('cartCount').textContent=pieces;$('bottomCartCount').textContent=pieces;$('cartPieces').textContent=pieces;$('cartTotal').textContent=money(total)+' د.ع'}
function openCart(){const items=cartItems();$('cartItems').innerHTML=items.length?items.map(x=>`<div class="cart-item"><img src="${esc(x.image)}" alt=""><div><strong>${esc(x.name)}</strong><div>${money(x.price)} د.ع${sold(x)?' • نفدت الكمية':''}</div><div class="qty"><button data-dec="${esc(x.id)}">−</button><b>${x.qty}</b><button data-inc="${esc(x.id)}" ${sold(x)?'disabled':''}>+</button></div></div><button class="remove" data-del="${esc(x.id)}">حذف</button></div>`).join(''):'<div class="empty">السلة فارغة</div>';updateCart();openDialog('cartModal')}
function inc(id){const p=products.find(x=>x.id===id);if(!p||sold(p))return toast('نفدت الكمية');if(p.stock!==null&&(cart[id]||0)>=p.stock)return toast('وصلت للكمية المتوفرة');cart[id]=(cart[id]||0)+1;saveCart();openCart()}
function dec(id){if(--cart[id]<=0)delete cart[id];saveCart();openCart()}
function del(id){delete cart[id];saveCart();openCart()}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1400)}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o)return openProduct(o.dataset.open);const a=e.target.closest('[data-add]');if(a&&!a.disabled)return add(a.dataset.add);const i=e.target.closest('[data-inc]');if(i)return inc(i.dataset.inc);const d=e.target.closest('[data-dec]');if(d)return dec(d.dataset.dec);const r=e.target.closest('[data-del]');if(r)return del(r.dataset.del)});
$('q').addEventListener('input',render);$('cartBtn').onclick=openCart;$('bottomCartBtn').onclick=openCart;$('menuBtn').onclick=()=>location.hash='products';
$('checkoutForm').addEventListener('submit',e=>{e.preventDefault();const items=cartItems().filter(x=>!sold(x));if(!items.length)return toast('السلة فارغة أو المنتجات غير متوفرة');const n=$('customerName').value.trim(),p=$('phone').value.trim(),ad=$('address').value.trim(),nt=$('note').value.trim(),total=items.reduce((s,x)=>s+x.qty*x.price,0);let msg=`طلب جديد - معرض الفردوس\n\nالاسم: ${n}\nالهاتف: ${p}\nالعنوان: ${ad}\n`;if(nt)msg+=`ملاحظات: ${nt}\n`;msg+='\nالمنتجات:\n'+items.map((x,i)=>`${i+1}) ${x.name} | ${x.qty} × ${money(x.price)} = ${money(x.qty*x.price)} د.ع`).join('\n')+`\n\nالإجمالي: ${money(total)} د.ع`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank')});
function showCached(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'[]');if(Array.isArray(c)&&c.length){products=c;render()}}catch{}}
async function load(){showCached();try{const res=await fetch(CSV_URL+(CSV_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const fresh=normalize(parseCSV(await res.text()));products=fresh;localStorage.setItem(CACHE,JSON.stringify(fresh));render()}catch(err){console.error(err);if(!products.length){$('status').textContent='تعذر التحميل';$('grid').innerHTML='<div class="empty">تعذر تحميل المنتجات. حاول تحديث الصفحة.</div>'}}}
load();
</script>
</body>
</html>
